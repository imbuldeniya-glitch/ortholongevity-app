<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Know Your Knee Age — OrthoLongevity™</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --forest:#0f2d1e;--forest-mid:#1a3d2a;--forest-light:#234d36;
  --teal:#1d9e75;--teal-light:#5dcaa5;--teal-pale:#e1f5ee;
  --cream:#f7f3ed;--charcoal:#1c1c1a;--muted:#6b7c71;
  --gold:#c9a84c;--white:#ffffff;--red:#e05555;--amber:#e09a3a;--green:#27a96c;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--forest);color:var(--cream);font-family:var(--font-body);font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px}

/* SHELL */
.shell{width:100%;max-width:580px;margin:0 auto}

/* HEADER */
.hdr{text-align:center;padding:36px 0 28px;animation:fadeup 0.5s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.hdr-logo-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.hdr-leaf{width:28px;height:28px;flex-shrink:0}
.hdr-logo{font-family:var(--font-display);font-size:19px;color:var(--cream);letter-spacing:0.01em}
.hdr-logo span{color:var(--teal-light)}
.hdr-tag{font-size:12px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:28px}

/* TRUST STRIP */
.trust-strip{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px 20px;margin-bottom:28px;text-align:left;animation:fadeup 0.5s 0.1s ease both}
.trust-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(29,158,117,0.45);flex-shrink:0;box-shadow:0 0 18px rgba(29,158,117,0.18)}
.trust-text{}
.trust-name{font-size:13px;font-weight:600;color:var(--cream);font-family:var(--font-display);line-height:1.2;margin-bottom:2px}
.trust-role{font-size:11px;color:rgba(247,243,237,0.55);line-height:1.5}
.trust-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:100px;padding:2px 9px;font-size:10px;color:var(--gold);margin-top:5px;font-weight:500}

/* PROGRESS */
.progress-wrap{margin-bottom:32px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.progress-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-light));border-radius:2px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1)}

/* CARD */
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:36px;margin-bottom:16px;animation:cardIn 0.35s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.q-eyebrow{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal-light);margin-bottom:12px}
.q-text{font-family:var(--font-display);font-size:clamp(20px,4vw,26px);font-weight:700;color:var(--cream);line-height:1.3;margin-bottom:8px}
.q-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.5}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 20px;cursor:pointer;transition:border-color 0.2s,background 0.2s,transform 0.15s;text-align:left;width:100%;font-family:var(--font-body);font-size:15px;color:var(--cream)}
.opt:hover{border-color:rgba(29,158,117,0.5);background:rgba(29,158,117,0.07);transform:translateX(3px)}
.opt.selected{border-color:var(--teal);background:rgba(29,158,117,0.15)}
.opt-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background 0.2s}
.opt.selected .opt-icon{background:rgba(29,158,117,0.2)}
.opt-label{font-size:15px;font-weight:400;color:var(--cream)}
.opt-note{font-size:11px;color:var(--muted);margin-top:2px}

/* SLIDER QUESTION */
.slider-wrap{margin-top:8px}
.slider-val{font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--teal-light);text-align:center;margin-bottom:4px;line-height:1}
.slider-unit{font-size:14px;color:var(--muted);text-align:center;margin-bottom:20px}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--teal);cursor:pointer;box-shadow:0 2px 8px rgba(29,158,117,0.4)}
.slider-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}

/* PAIN SCALE */
.pain-scale{display:flex;gap:6px;margin-top:8px}
.pain-btn{flex:1;aspect-ratio:1;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all 0.15s;font-family:var(--font-body)}
.pain-btn:hover{border-color:rgba(29,158,117,0.4)}
.pain-btn.selected{color:var(--cream);font-weight:600}
.pain-btn[data-v="0"].selected,.pain-btn[data-v="1"].selected,.pain-btn[data-v="2"].selected,.pain-btn[data-v="3"].selected{background:rgba(39,169,108,0.25);border-color:var(--green)}
.pain-btn[data-v="4"].selected,.pain-btn[data-v="5"].selected,.pain-btn[data-v="6"].selected{background:rgba(224,154,58,0.25);border-color:var(--amber)}
.pain-btn[data-v="7"].selected,.pain-btn[data-v="8"].selected,.pain-btn[data-v="9"].selected,.pain-btn[data-v="10"].selected{background:rgba(224,85,85,0.25);border-color:var(--red)}
.pain-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}

/* NEXT BTN */
.next-wrap{margin-top:24px;text-align:right}
.next-btn{background:var(--teal);color:var(--white);border:none;border-radius:100px;padding:14px 32px;font-family:var(--font-body);font-size:15px;font-weight:500;cursor:pointer;transition:background 0.2s,transform 0.15s,box-shadow 0.2s;opacity:0.4;pointer-events:none}
.next-btn.active{opacity:1;pointer-events:all}
.next-btn.active:hover{background:#159060;transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,158,117,0.35)}

/* OPTIONAL SECTION */
.optional-banner{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.25);border-radius:18px;padding:24px 28px;margin-bottom:16px;animation:cardIn 0.35s ease both}
.ob-title{font-size:16px;font-weight:500;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.ob-body{font-size:13px;color:rgba(247,243,237,0.6);line-height:1.6;margin-bottom:16px}
.ob-btns{display:flex;gap:10px}
.ob-yes{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);color:var(--gold);border-radius:100px;padding:10px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font-body);transition:background 0.2s}
.ob-yes:hover{background:rgba(201,168,76,0.25)}
.ob-skip{background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--muted);border-radius:100px;padding:10px 22px;font-size:14px;cursor:pointer;font-family:var(--font-body);transition:border-color 0.2s,color 0.2s}
.ob-skip:hover{border-color:rgba(255,255,255,0.3);color:var(--cream)}

/* RESULT */
.result-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:40px 36px;animation:cardIn 0.4s ease both;text-align:center}
.result-label{font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal-light);margin-bottom:16px}
.result-ring{width:180px;height:180px;margin:0 auto 24px;position:relative}
.result-ring svg{width:180px;height:180px}
.result-centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result-age{font-family:var(--font-display);font-size:56px;font-weight:700;line-height:1}
.result-age-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:3px}
.result-compare{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.rc-box{text-align:center;padding:14px 24px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px}
.rc-box.highlight{background:rgba(29,158,117,0.15);border-color:rgba(29,158,117,0.4)}
.rc-val{font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--cream)}
.rc-box.highlight .rc-val{color:var(--teal-light)}
.rc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px}
.rc-arrow{font-size:22px;color:var(--muted)}
.result-verdict{font-family:var(--font-display);font-size:22px;font-style:italic;color:var(--cream);margin-bottom:8px}
.result-body{font-size:14px;color:rgba(247,243,237,0.6);line-height:1.7;margin-bottom:28px;max-width:480px;margin-left:auto;margin-right:auto}

/* ACTIONS */
.actions-title{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;text-align:left}
.action-item{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin-bottom:8px;text-align:left}
.ai-icon{width:36px;height:36px;border-radius:10px;background:rgba(29,158,117,0.15);border:1px solid rgba(29,158,117,0.25);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ai-title{font-size:14px;font-weight:500;color:var(--cream);margin-bottom:3px}
.ai-sub{font-size:12px;color:var(--muted);line-height:1.5}
.ai-pill{display:inline-block;font-size:10px;font-weight:500;letter-spacing:0.05em;background:rgba(29,158,117,0.1);border:1px solid rgba(29,158,117,0.2);color:var(--teal-light);padding:2px 8px;border-radius:100px;margin-top:5px}

/* PILLAR SCORES */
.pillars-title{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 14px;text-align:left}
.pillar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pillar-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.pillar-name{font-size:12px;color:rgba(247,243,237,0.7);width:150px;flex-shrink:0;line-height:1.3}
.pillar-bar{flex:1;height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden}
.pillar-fill{height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}
.pillar-val{font-size:12px;font-weight:600;color:var(--cream);width:26px;text-align:right;flex-shrink:0}
.pillar-tag{font-size:9px;font-weight:500;letter-spacing:0.04em;padding:1px 6px;border-radius:100px;flex-shrink:0}
.pillar-tag.good{background:rgba(39,169,108,0.15);color:#5dcaa5;border:1px solid rgba(39,169,108,0.25)}
.pillar-tag.warn{background:rgba(224,154,58,0.15);color:#e09a3a;border:1px solid rgba(224,154,58,0.25)}
.pillar-tag.risk{background:rgba(224,85,85,0.15);color:#e05555;border:1px solid rgba(224,85,85,0.25)}

/* FOUNDER — subtle result top strip */
.founder-strip{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 18px;margin-bottom:28px;text-align:left}
.founder-strip-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(29,158,117,0.35);flex-shrink:0}
.founder-strip-name{font-size:13px;font-weight:500;color:var(--cream);line-height:1.3}
.founder-strip-role{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
.founder-strip-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:100px;padding:2px 8px;font-size:10px;color:var(--gold);margin-top:4px}

/* FOUNDER — full weight in CTA */
.wl-founder{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px 20px;margin-bottom:24px;text-align:left;position:relative;z-index:1}
.wl-founder-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(29,158,117,0.5);flex-shrink:0;box-shadow:0 0 20px rgba(29,158,117,0.2)}
.wl-founder-name{font-size:15px;font-weight:600;color:var(--cream);margin-bottom:3px;font-family:var(--font-display)}
.wl-founder-creds{font-size:12px;color:rgba(247,243,237,0.6);line-height:1.6}
.wl-founder-creds strong{color:var(--teal-light);font-weight:500}
.wl-founder-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wl-founder-badge{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:3px 10px;font-size:10px;font-weight:500;letter-spacing:0.03em}
.wl-founder-badge.gold{background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.3);color:var(--gold)}
.wl-founder-badge.teal{background:rgba(29,158,117,0.12);border:1px solid rgba(29,158,117,0.3);color:var(--teal-light)}

/* WL CTA */
.wl-cta{background:linear-gradient(160deg,rgba(15,45,30,0.95) 0%,rgba(26,61,42,0.98) 100%);border:1px solid rgba(29,158,117,0.4);border-radius:22px;padding:36px 32px;margin-top:24px;text-align:center;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(29,158,117,0.12)}
.wl-cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(29,158,117,0.1) 0%,transparent 70%);pointer-events:none}
.wl-cta-eyebrow{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal-light);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.wl-cta-dot{width:6px;height:6px;border-radius:50%;background:var(--teal-light);animation:blink 2s infinite}
.wl-cta h3{font-family:var(--font-display);font-size:clamp(24px,4vw,32px);font-weight:700;color:var(--cream);margin-bottom:12px;line-height:1.2}
.wl-cta h3 em{font-style:italic;color:var(--teal-light)}
.wl-cta-body{font-size:15px;color:rgba(247,243,237,0.65);margin-bottom:24px;line-height:1.7;max-width:400px;margin-left:auto;margin-right:auto}
.wl-cta-body strong{color:var(--cream);font-weight:500}

/* CTA metric highlight */
.wl-cta-metric{background:rgba(255,255,255,0.04);border:1px solid rgba(29,158,117,0.25);border-radius:14px;padding:18px 22px;margin-bottom:22px;text-align:left}
.wl-cta-metric-label{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wl-cta-metric-name{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--teal-light);margin-bottom:6px}
.wl-cta-metric-desc{font-size:13px;color:rgba(247,243,237,0.6);line-height:1.5}

/* Feature chips */
.wl-features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.wl-feat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:6px 14px;font-size:12px;color:rgba(247,243,237,0.7)}
.wl-feat-icon{font-size:13px}

/* Input + button */
.wl-row{display:flex;gap:8px;max-width:440px;margin:0 auto 14px}
.wl-inp{flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:100px;padding:15px 22px;font-family:var(--font-body);font-size:15px;color:var(--cream);outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.wl-inp::placeholder{color:rgba(247,243,237,0.3)}
.wl-inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(29,158,117,0.15)}
.wl-sub{background:var(--teal);color:var(--white);border:none;border-radius:100px;padding:15px 26px;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background 0.2s,transform 0.15s,box-shadow 0.2s;letter-spacing:0.01em}
.wl-sub:hover{background:#159060;transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,158,117,0.4)}
.wl-sub:active{transform:translateY(0)}
.wl-reassure{font-size:12px;color:var(--muted);margin-bottom:0}
.wl-reassure span{color:rgba(247,243,237,0.45)}

/* Success state */
.wl-success{display:none;padding:20px;background:rgba(29,158,117,0.12);border:1px solid rgba(29,158,117,0.3);border-radius:16px;margin-top:4px}
.wl-success-tick{font-size:32px;margin-bottom:8px}
.wl-success-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--cream);margin-bottom:6px}
.wl-success-body{font-size:13px;color:rgba(247,243,237,0.6);line-height:1.6}
.wl-success-body a{color:var(--teal-light);text-decoration:none}
.wl-success-body a:hover{text-decoration:underline}

/* Social proof strip */
.wl-proof{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;font-size:12px;color:var(--muted)}
.wl-proof-count{color:var(--teal-light);font-weight:600}

.disclaimer{font-size:11px;color:var(--muted);opacity:0.5;text-align:center;margin-top:20px;line-height:1.6;padding:0 10px}

@media(max-width:480px){
  body{padding:12px}
  .card{padding:24px 20px}
  .pain-scale{gap:3px}
  .pain-btn{font-size:11px}
  .result-card{padding:28px 20px}
  .wl-row{flex-direction:column}
}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->

// ─── SCORING ─────────────────────────────────────────────────────────────────

function calcKneeAge(answers, optAnswers) {
  let age = answers.age || 45;

  // ── PILLAR SCORES (0–100, higher = healthier) ────────────────────────────
  // Each pillar starts at a base and is adjusted by relevant inputs

  // 1. STRENGTH & LOAD (activity, sitting)
  let strength = 70;
  if (answers.activity === 'sedentary') strength -= 25;
  if (answers.activity === 'light')     strength -= 10;
  if (answers.activity === 'moderate')  strength += 10;
  if (answers.activity === 'athletic')  strength += 18;
  if (answers.sitting === 'yes')        strength -= 10;
  if (answers.sitting === 'no')         strength += 5;

  // 2. LOAD TOLERANCE (injury history, activity)
  let loadTolerance = 75;
  if (answers.injury === 'injury_only') loadTolerance -= 15;
  if (answers.injury === 'surgery')     loadTolerance -= 25;
  if (answers.activity === 'athletic')  loadTolerance += 5;
  if (answers.activity === 'sedentary') loadTolerance -= 8;

  // 3. METABOLIC & NUTRITIONAL HEALTH (BMI, nutrition, smoking, sex/age)
  let metabolic = 72;
  if (answers.bmi_mode === 'over')        metabolic -= 15;
  if (answers.bmi_mode === 'obese')       metabolic -= 28;
  if (answers.bmi_mode === 'under')       metabolic -= 8;
  if (answers.nutrition === 'anti_inflam')metabolic += 10;
  if (answers.nutrition === 'processed') metabolic -= 18;
  if (answers.nutrition === 'mixed')      metabolic -= 5;
  if (answers.smoking === 'yes')          metabolic -= 15;
  if (answers.smoking === 'ex')           metabolic -= 7;
  if (optAnswers.omega3 === 'often')      metabolic += 6;
  if (optAnswers.omega3 === 'rarely')     metabolic -= 6;
  if (answers.sex === 'female' && age >= 50) metabolic -= 5;

  // 4. RECOVERY (sleep, activity)
  let recovery = 72;
  if (optAnswers.sleep === 'poor')        recovery -= 20;
  if (optAnswers.sleep === 'ok')          recovery -= 8;
  if (optAnswers.sleep === 'good')        recovery += 5;
  if (answers.activity === 'sedentary')   recovery -= 5;
  if (answers.smoking === 'yes')          recovery -= 8;

  // 5. INJURY RISK (injury history, pain, family)
  let injuryRisk = 78;
  if (answers.pain >= 4 && answers.pain <= 6) injuryRisk -= 15;
  if (answers.pain >= 7)                       injuryRisk -= 25;
  if (answers.injury === 'injury_only')        injuryRisk -= 10;
  if (answers.injury === 'surgery')            injuryRisk -= 18;
  if (optAnswers.family === 'yes')             injuryRisk -= 12;
  if (answers.activity === 'moderate')         injuryRisk += 5;
  if (answers.activity === 'athletic')         injuryRisk += 3;

  // Clamp all scores
  const clamp = v => Math.min(100, Math.max(10, Math.round(v)));
  strength     = clamp(strength);
  loadTolerance= clamp(loadTolerance);
  metabolic    = clamp(metabolic);
  recovery     = clamp(recovery);
  injuryRisk   = clamp(injuryRisk);

  // ── OVERALL DELTA ────────────────────────────────────────────────────────
  // Weighted average deficit from 100 → convert to age delta
  const avgScore = (strength * 0.30 + loadTolerance * 0.20 + metabolic * 0.25 + recovery * 0.15 + injuryRisk * 0.10);
  // avgScore of 75 = neutral (0 delta). Each point below/above = ~0.25 years
  const delta = Math.round((75 - avgScore) * 0.35);

  let kneeAge = Math.round(age + delta);
  kneeAge = Math.max(18, Math.min(kneeAge, 90));

  return {
    kneeAge, delta, age,
    pillars: {
      strength, loadTolerance, metabolic, recovery, injuryRisk
    }
  };
}

function getVerdict(delta) {
  if (delta <= -3) return {
    label:'Younger than your years',
    color:'var(--green)',
    ring:'var(--green)',

// ─── STATE ───────────────────────────────────────────────────────────────────

let phase = 'core'; // 'core' | 'optional-prompt' | 'optional' | 'result'
let coreIndex = 0;
let optIndex = 0;
let coreAnswers = {};
let optAnswers = {};
let doOptional = false;

// ─── RENDER ───────────────────────────────────────────────────────────────────

function updateProgress() {
  let current, total, pct;
  if (phase === 'core') {
    current = coreIndex + 1; total = 9; pct = Math.round((coreIndex / 9) * 100);
  } else if (phase === 'optional-prompt') {
    current = 8; total = 8; pct = 100;
  } else if (phase === 'optional') {
    current = optIndex + 1; total = OPTIONAL_QUESTIONS.length; pct = Math.round((optIndex / OPTIONAL_QUESTIONS.length) * 100);
    document.getElementById('progressText').textContent = `Refining — Question ${current} of ${total}`;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
    return;
  } else {
    document.getElementById('progressWrap').style.display = 'none';
    return;
  }
  document.getElementById('progressText').textContent = `Question ${current} of ${total}`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

function render() {
  updateProgress();
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  if (phase === 'core') {
    renderQuestion(container, CORE_QUESTIONS[coreIndex], coreAnswers, (val) => {
      coreAnswers[CORE_QUESTIONS[coreIndex].id] = val;
      coreIndex++;
      if (coreIndex >= 9) {
        phase = 'optional-prompt';
      }
      render();
    });
  } else if (phase === 'optional-prompt') {
    renderOptionalPrompt(container);
  } else if (phase === 'optional') {
    renderQuestion(container, OPTIONAL_QUESTIONS[optIndex], optAnswers, (val) => {
      optAnswers[OPTIONAL_QUESTIONS[optIndex].id] = val;
      optIndex++;
      if (optIndex >= OPTIONAL_QUESTIONS.length) {
        phase = 'result';
      }
      render();
    });
  } else {
    renderResult(container);
  }
}

function renderQuestion(container, q, answersObj, onAnswer) {
  const card = document.createElement('div');
  card.className = 'card';

  let html = `<div class="q-eyebrow">${q.eyebrow}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-sub">${q.sub}</div>`;

  if (q.type === 'options') {
    html += `<div class="options">`;
    q.options.forEach(opt => {
      html += `<button class="opt${answersObj[q.id] === opt.value ? ' selected' : ''}" onclick="selectOpt(this,'${q.id}','${opt.value}')">
        <div class="opt-icon">${opt.icon}</div>
        <div><div class="opt-label">${opt.label}</div>${opt.note ? `<div class="opt-note">${opt.note}</div>` : ''}</div>
      </button>`;
    });
    html += `</div>`;
  } else if (q.type === 'slider') {
    const val = answersObj[q.id] || q.default;
    html += `<div class="slider-wrap">
      <div class="slider-val" id="sliderVal">${val}</div>
      <div class="slider-unit">${q.unit}</div>
      <input type="range" min="${q.min}" max="${q.max}" value="${val}" id="sliderInput" oninput="updateSlider(this)"/>
      <div class="slider-labels"><span>${q.labels[0]}</span><span>${q.labels[1]}</span></div>
    </div>`;
  } else if (q.type === 'pain') {
    const val = answersObj[q.id] !== undefined ? answersObj[q.id] : -1;
    html += `<div class="pain-scale">`;
    for (let i = 0; i <= 10; i++) {
      html += `<button class="pain-btn${val === i ? ' selected' : ''}" data-v="${i}" onclick="selectPain(this,${i})">${i}</button>`;
    }
    html += `</div><div class="pain-labels"><span>No pain</span><span>Severe</span></div>`;
  }

  html += `<div class="next-wrap"><button class="next-btn${(answersObj[q.id] !== undefined || q.type === 'slider') ? ' active' : ''}" id="nextBtn" onclick="nextQ()">Continue →</button></div>`;

  card.innerHTML = html;
  container.appendChild(card);

  // Store callback
  window._onAnswer = onAnswer;
  window._currentQ = q;
  window._currentAnswers = answersObj;

  // Slider: set initial active
  if (q.type === 'slider') {
    const inp = document.getElementById('sliderInput');
    if (inp) {
      answersObj[q.id] = answersObj[q.id] || q.default;
      document.getElementById('nextBtn').classList.add('active');
    }
  }
}

function selectOpt(btn, qid, val) {
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  window._currentAnswers[qid] = val;
  document.getElementById('nextBtn').classList.add('active');
}

function selectPain(btn, val) {
  document.querySelectorAll('.pain-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  window._currentAnswers[window._currentQ.id] = val;
  document.getElementById('nextBtn').classList.add('active');
}

function updateSlider(inp) {
  document.getElementById('sliderVal').textContent = inp.value;
  window._currentAnswers[window._currentQ.id] = parseInt(inp.value);
}

function nextQ() {
  const ans = window._currentAnswers[window._currentQ.id];
  if (ans !== undefined) {
    window._onAnswer(ans);
  }
}

function renderOptionalPrompt(container) {
  const div = document.createElement('div');
  div.className = 'optional-banner';
  div.innerHTML = `
    <div class="ob-title">⭐ Refine your score — optional</div>
    <div class="ob-body">You have a score. Three short questions about nutrition, sleep, and family history can make it more accurate. Takes under 60 seconds — completely optional.</div>
    <div class="ob-btns">
      <button class="ob-yes" onclick="startOptional()">Yes, refine my score</button>
      <button class="ob-skip" onclick="skipToResult()">Skip — show me my result</button>
    </div>
  `;
  container.appendChild(div);
}

function startOptional() {
  doOptional = true;
  phase = 'optional';
  render();
}

function skipToResult() {
  phase = 'result';
  render();
}
