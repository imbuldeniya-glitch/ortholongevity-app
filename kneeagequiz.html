<style>
:root{
  --forest:#0f2d1e;--teal:#1d9e75;--teal-l:#5dcaa5;
  --cream:#f7f3ed;--muted:#6b7c71;--gold:#c9a84c;--w:#ffffff;
  --red:#e05555;--amber:#e09a3a;--green:#27a96c;
  --d1c:#1d9e75;--d1p:#085041;--d1b:#e1f5ee;--d1bd:#5dcaa5;
  --d2c:#639922;--d2p:#27500a;--d2b:#eaf3de;--d2bd:#97c459;
  --d3c:#ba7517;--d3p:#633806;--d3b:#faeeda;--d3bd:#ef9f27;
  --d4c:#e24b4a;--d4p:#791f1f;--d4b:#fcebeb;--d4bd:#f09595;
  --d5c:#7f77dd;--d5p:#3c3489;--d5b:#eeedfe;--d5bd:#afa9ec;
  --fd:'Playfair Display',Georgia,serif;--fb:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--forest);color:var(--cream);font-family:var(--fb);font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.shell{width:100%;max-width:560px;margin:0 auto}

/* HOOK SCREEN */
.hook{text-align:center;padding:48px 20px 36px;animation:fu .6s ease both}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hook-logo{font-family:var(--fd);font-size:17px;color:rgba(247,243,237,.5);letter-spacing:.02em;margin-bottom:32px}
.hook-logo span{color:var(--teal-l)}
.hook-eyebrow{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-l);margin-bottom:16px}
.hook-h1{font-family:var(--fd);font-size:clamp(36px,8vw,52px);font-weight:700;color:var(--cream);line-height:1.1;margin-bottom:16px}
.hook-sub{font-size:17px;color:rgba(247,243,237,.65);line-height:1.6;margin-bottom:36px;max-width:380px;margin-left:auto;margin-right:auto}
.hook-stats{display:flex;gap:12px;justify-content:center;margin-bottom:36px;flex-wrap:wrap}
.hook-stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:6px 16px;font-size:12px;color:rgba(247,243,237,.6)}
.hook-stat span{color:var(--teal-l);font-weight:600}
.start-btn{display:inline-block;background:var(--teal);color:var(--w);border:none;border-radius:100px;padding:18px 44px;font-family:var(--fb);font-size:17px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s;letter-spacing:.01em}
.start-btn:hover{background:#159060;transform:translateY(-2px);box-shadow:0 12px 32px rgba(29,158,117,.35)}
.hook-time{font-size:12px;color:var(--muted);margin-top:14px}
.hook-surgeon{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 18px;margin-top:32px;text-align:left}
.hook-sname{font-size:13px;font-weight:600;color:var(--cream);font-family:var(--fd);margin-bottom:1px}
.hook-srole{font-size:11px;color:rgba(247,243,237,.5);line-height:1.5}
.hook-sbadge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);border-radius:100px;padding:2px 8px;font-size:10px;color:var(--gold);margin-top:4px;font-weight:500}

/* PROGRESS */
.prog-wrap{margin-bottom:24px;padding:0 2px}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-txt{font-size:12px;color:var(--muted);font-weight:500}
.prog-pct{font-size:12px;color:var(--teal-l);font-weight:600}
.prog-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-l));border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.micro-reward{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.25);border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:12px;color:var(--teal-l);text-align:center;animation:fu .3s ease both}

/* CARD */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px;margin-bottom:14px;animation:ci .35s ease both}
@keyframes ci{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-ey{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-l);margin-bottom:8px}
.q-dbadge{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:3px 10px;font-size:11px;font-weight:500;margin-bottom:10px;border:1px solid}
.q-txt{font-family:var(--fd);font-size:clamp(18px,4vw,24px);font-weight:700;color:var(--cream);line-height:1.3;margin-bottom:7px}
.q-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;text-align:left;width:100%;font-family:var(--fb);color:var(--cream)}
.opt:hover{border-color:rgba(29,158,117,.5);background:rgba(29,158,117,.07);transform:translateX(2px)}
.opt.sel{border-color:var(--teal);background:rgba(29,158,117,.15)}
.opt-ic{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.opt.sel .opt-ic{background:rgba(29,158,117,.2)}
.opt-lbl{font-size:14px;font-weight:400;color:var(--cream)}
.opt-note{font-size:11px;color:var(--muted);margin-top:1px}
.sl-wrap{margin-top:6px}
.sl-val{font-family:var(--fd);font-size:52px;font-weight:700;color:var(--teal-l);text-align:center;margin-bottom:2px;line-height:1}
.sl-unit{font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--teal);cursor:pointer;box-shadow:0 2px 10px rgba(29,158,117,.4)}
.sl-lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px}
.pain-scale{display:flex;gap:4px;margin-top:7px}
.pbtn{flex:1;aspect-ratio:1;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;font-size:11px;font-weight:500;color:var(--muted);transition:all .15s;font-family:var(--fb)}
.pbtn.sel{color:var(--cream);font-weight:600}
.pbtn[data-v="0"].sel,.pbtn[data-v="1"].sel,.pbtn[data-v="2"].sel,.pbtn[data-v="3"].sel{background:rgba(39,169,108,.25);border-color:var(--green)}
.pbtn[data-v="4"].sel,.pbtn[data-v="5"].sel,.pbtn[data-v="6"].sel{background:rgba(224,154,58,.25);border-color:var(--amber)}
.pbtn[data-v="7"].sel,.pbtn[data-v="8"].sel,.pbtn[data-v="9"].sel,.pbtn[data-v="10"].sel{background:rgba(224,85,85,.25);border-color:var(--red)}
.pain-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}
.nxt-wrap{margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.back-btn{background:none;border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:13px 24px;font-family:var(--fb);font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s,transform .15s;color:var(--muted)}
.back-btn:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.04);transform:translateY(-1px);color:var(--cream)}
.nxt-btn{background:var(--teal);color:var(--w);border:none;border-radius:100px;padding:13px 28px;font-family:var(--fb);font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,transform .15s;opacity:.35;pointer-events:none;margin-left:auto}
.nxt-btn.on{opacity:1;pointer-events:all}
.nxt-btn.on:hover{background:#159060;transform:translateY(-1px)}

/* RESULT */
.res-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px 28px;animation:ci .4s ease both;text-align:center}

/* HERO */
.res-eyebrow{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-l);margin-bottom:20px}
.res-age-big{font-family:var(--fd);font-size:clamp(72px,18vw,100px);font-weight:700;line-height:1;margin-bottom:4px}
.res-age-lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
.res-compare{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:8px 20px;margin-bottom:20px}
.res-compare-txt{font-size:14px;color:rgba(247,243,237,.7)}
.res-compare-age{font-size:14px;font-weight:600;color:var(--cream)}

/* STATUS LINE — the shareable bit */
.status-line{font-family:var(--fd);font-size:clamp(18px,4vw,24px);font-weight:700;line-height:1.3;margin-bottom:8px}
.identity{font-size:14px;color:rgba(247,243,237,.65);line-height:1.6;margin-bottom:24px;max-width:420px;margin-left:auto;margin-right:auto}

/* SHARE BUTTON */
.share-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);color:var(--gold);border-radius:100px;padding:11px 24px;font-family:var(--fb);font-size:14px;font-weight:500;cursor:pointer;transition:background .2s,transform .15s;margin-bottom:28px}
.share-btn:hover{background:rgba(201,168,76,.2);transform:translateY(-1px)}
.share-copied{background:rgba(39,169,108,.15);border-color:rgba(39,169,108,.4);color:var(--green)}

/* COMPARISON */
.compare-wrap{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;margin-bottom:22px;text-align:left}
.compare-title{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.compare-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.compare-row:last-child{margin-bottom:0}
.compare-lbl{font-size:12px;color:rgba(247,243,237,.7);width:120px;flex-shrink:0}
.compare-bar{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.compare-fill{height:100%;border-radius:3px}
.compare-rng{font-size:11px;color:var(--muted);width:60px;text-align:right;flex-shrink:0}
.compare-you{font-size:10px;color:var(--teal-l);font-weight:600;flex-shrink:0}

/* IMPROVE HOOK */
.improve-hook{background:linear-gradient(135deg,rgba(29,158,117,.15),rgba(29,158,117,.08));border:1px solid rgba(29,158,117,.3);border-radius:14px;padding:16px 18px;margin-bottom:22px;text-align:left}
.improve-hook-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--cream);margin-bottom:4px}
.improve-hook-sub{font-size:13px;color:rgba(247,243,237,.65);line-height:1.5}
.improve-hook-num{font-size:32px;font-weight:700;color:var(--teal-l);font-family:var(--fd)}

/* DRIVERS */
.drivers-title{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;text-align:left}
.driver-row{margin-bottom:12px}
.driver-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.driver-nw{display:flex;align-items:center;gap:7px}
.driver-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.driver-name{font-size:13px;font-weight:500;color:var(--cream)}
.driver-sv{display:flex;align-items:center;gap:6px}
.driver-score{font-size:13px;font-weight:600;color:var(--cream)}
.driver-tag{font-size:9px;font-weight:500;letter-spacing:.04em;padding:1px 6px;border-radius:100px;border:1px solid}
.driver-tag.g{background:rgba(39,169,108,.15);color:#5dcaa5;border-color:rgba(39,169,108,.3)}
.driver-tag.w{background:rgba(224,154,58,.15);color:#e09a3a;border-color:rgba(224,154,58,.3)}
.driver-tag.r{background:rgba(224,85,85,.15);color:#e05555;border-color:rgba(224,85,85,.3)}
.driver-bar{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.driver-fill{height:100%;border-radius:4px;transition:width 1.3s cubic-bezier(.4,0,.2,1)}

/* INFO PANELS */
.info-panel{border-radius:13px;padding:14px 16px;margin-bottom:8px;text-align:left}
.ip-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ip-icon{font-size:14px}
.ip-title{font-size:13px;font-weight:600}
.ip-body{font-size:12px;color:rgba(247,243,237,.65);line-height:1.6;margin:0 0 5px}
.ip-cta{display:inline-block;font-size:10px;font-weight:500;padding:3px 10px;border-radius:100px}

/* ACTIONS */
.actions-title{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;text-align:left;margin-top:20px}
.act{display:flex;gap:12px;align-items:flex-start;border-radius:13px;padding:14px;margin-bottom:8px;text-align:left;border:1px solid rgba(255,255,255,.08)}
.act-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.act-title{font-size:14px;font-weight:500;color:var(--cream);margin-bottom:3px}
.act-sub{font-size:12px;color:var(--muted);line-height:1.5}

/* SURGEON BLOCK */
.surgeon-block{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;margin:20px 0;text-align:left}
.surgeon-block-title{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.surgeon-block-body{font-size:13px;color:rgba(247,243,237,.75);line-height:1.6}
.surgeon-block-body strong{color:var(--cream)}

/* CTA */
.cta-wrap{background:rgba(15,45,30,.95);border:1px solid rgba(29,158,117,.4);border-radius:20px;padding:28px;margin-top:20px;text-align:center}
.cta-ey{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-l);margin-bottom:10px}
.cta-h{font-family:var(--fd);font-size:clamp(20px,4vw,26px);font-weight:700;color:var(--cream);margin-bottom:8px;line-height:1.2}
.cta-h em{font-style:italic;color:var(--teal-l)}
.cta-sub{font-size:14px;color:rgba(247,243,237,.6);margin-bottom:20px;line-height:1.6}
.cta-primary{display:block;background:var(--teal);color:var(--w);border:none;border-radius:100px;padding:16px 32px;font-family:var(--fb);font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s;margin-bottom:10px;width:100%}
.cta-primary:hover{background:#159060;transform:translateY(-1px)}
.cta-secondary{font-size:12px;color:var(--muted);margin-bottom:20px}
.cta-secondary span{color:var(--teal-l);font-weight:600}
.soc-link{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:10px 14px;margin-bottom:7px;text-decoration:none}
.soc-link:hover{background:rgba(29,158,117,.08);border-color:rgba(29,158,117,.3)}
.soc-ic{width:30px;height:30px;border-radius:8px;background:rgba(29,158,117,.15);border:1px solid rgba(29,158,117,.2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.soc-name{font-size:12px;font-weight:500;color:var(--cream)}
.soc-desc{font-size:11px;color:var(--muted);margin-top:1px}
.soc-arr{margin-left:auto;color:var(--teal-l);font-size:13px;flex-shrink:0}
.disc{font-size:11px;color:var(--muted);opacity:.45;text-align:center;margin-top:16px;line-height:1.6;padding:0 6px}

/* SUPPLEMENTARY PANEL */
.supp-pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:5px 12px;font-family:var(--fb);font-size:11px;color:rgba(247,243,237,.7);cursor:pointer;transition:border-color .2s,background .2s}
.supp-pill:hover{border-color:rgba(29,158,117,.5);background:rgba(29,158,117,.07)}
.supp-pill.sel{border-color:var(--teal);background:rgba(29,158,117,.15);color:var(--cream)}
.supp-submit{display:block;width:100%;background:var(--teal);color:var(--w);border:none;border-radius:100px;padding:12px 24px;font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s}
.supp-submit:hover:not(:disabled){background:#159060}
.supp-submit:disabled{opacity:.35;cursor:not-allowed}
.supp-thank{text-align:center;padding:24px 0}
.supp-thank-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--cream);margin-bottom:6px}
.supp-thank-sub{font-size:13px;color:rgba(247,243,237,.55);line-height:1.5}

@media(max-width:480px){
  body{padding:10px}
  .hook{padding:36px 12px 28px}
  .card,.res-card,.cta-wrap{padding:20px 16px}
  .pain-scale{gap:2px}
  .pbtn{font-size:9px}
}

/* SHARE CARD */
.share-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;animation:fu .2s ease}
.share-modal{background:var(--forest);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center}
.share-modal-title{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-l);margin-bottom:18px}
.share-card-preview{border-radius:14px;overflow:hidden;margin-bottom:18px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.share-card-preview canvas{display:block;width:100%;height:auto}
.share-btns{display:flex;flex-direction:column;gap:8px}
.share-btn-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 16px;cursor:pointer;font-family:var(--fb);font-size:14px;color:var(--cream);transition:background .2s}
.share-btn-item:hover{background:rgba(255,255,255,.12)}
.share-btn-item.primary{background:var(--teal);border-color:var(--teal)}
.share-close{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:10px;font-family:var(--fb)}
.scorecard-section{margin:2rem 0;display:flex;flex-direction:column;align-items:center;gap:1rem}
.scorecard-section canvas{width:100%;max-width:500px;height:auto;border-radius:16px;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.share-cta-box{width:100%;max-width:500px;border-radius:14px;padding:1.25rem 1.5rem;text-align:center;font-family:Georgia,serif;border:0.5px solid rgba(201,168,76,0.35);background:rgba(201,168,76,0.1)}
.share-cta-headline{font-size:1.05rem;font-weight:bold;color:#C9A84C;line-height:1.4;margin-bottom:0.4rem}
.share-cta-sub{font-size:0.8rem;font-style:italic;color:rgba(255,255,255,0.45)}
.share-primary-btn{width:100%;max-width:500px;background:#C9A84C;color:#1E4D3B;font-family:Georgia,serif;font-size:1.1rem;font-weight:bold;padding:1rem;border-radius:12px;border:none;cursor:pointer;display:block}
.share-primary-sub{font-family:Georgia,serif;font-size:0.78rem;font-style:italic;color:rgba(255,255,255,0.45);text-align:center;margin-top:0.35rem}
.share-more-toggle{font-family:Georgia,serif;font-size:0.82rem;color:rgba(201,168,76,0.7);cursor:pointer;text-align:center;text-decoration:underline;background:none;border:none;margin-top:0.5rem}
.share-more-options{display:none;flex-direction:column;align-items:center;gap:0.6rem;width:100%;max-width:500px}
.share-more-options.open{display:flex}
.share-secondary-btn{width:100%;max-width:500px;background:transparent;color:#C9A84C;font-family:Georgia,serif;font-size:0.9rem;padding:0.6rem 1rem;border-radius:10px;border:0.5px solid rgba(201,168,76,0.4);cursor:pointer}
.share-tip{font-family:Georgia,serif;font-size:0.75rem;font-style:italic;color:rgba(255,255,255,0.35);text-align:center;max-width:500px;line-height:1.5}
.share-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1E4D3B;color:#C9A84C;font-family:Georgia,serif;font-size:0.85rem;padding:0.6rem 1.2rem;border-radius:8px;border:0.5px solid rgba(201,168,76,0.4);z-index:9999;text-align:center}
/* PRIME BREAKDOWN (results) */
.prime-breakdown{text-align:left;margin:6px 0 22px;padding-top:22px;border-top:1px solid rgba(255,255,255,.08)}
.pb-h{font-family:var(--fd);font-size:clamp(20px,4.5vw,26px);font-weight:700;color:var(--cream);margin-bottom:2px}
.pb-sub{font-size:13px;color:rgba(247,243,237,.55);margin-bottom:20px}
.pb-row{margin-bottom:16px}
.pb-meta{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.pb-letter{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--gold);line-height:1;width:18px;flex-shrink:0;text-align:center}
.pb-name{font-size:14px;font-weight:600;color:var(--cream);flex:1;display:flex;align-items:center;gap:7px}
.pb-score{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--teal-l)}
.pb-score-max{font-size:10px;color:var(--muted);font-weight:400}
.pb-track{position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.pb-fill{height:100%;border-radius:99px;transition:width .6s ease}
.pb-desc{font-size:12px;color:rgba(247,243,237,.5);margin-top:5px}
.pb-track-risk{overflow:visible}
.pb-marker{position:absolute;top:-3px;width:3px;height:15px;border-radius:2px;background:var(--cream);box-shadow:0 0 0 2px rgba(15,45,30,.65);transform:translateX(-50%)}
.pb-scale{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.pb-info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid rgba(247,243,237,.3);background:none;color:rgba(247,243,237,.6);font-size:10px;font-style:italic;font-family:Georgia,serif;cursor:help;padding:0;line-height:1}
.pb-band{border:1px solid;border-radius:12px;padding:14px 16px;margin:2px 0 18px;background:rgba(255,255,255,.03)}
.pb-band-head{font-family:var(--fd);font-size:15px;font-weight:700;margin-bottom:6px}
.pb-band-msg{font-size:13px;color:rgba(247,243,237,.75);line-height:1.6;margin-bottom:13px}
.pb-band-cta{display:inline-block;font-size:13px;font-weight:600;font-family:var(--fb);text-decoration:none;background:var(--gold);color:#173d2c;padding:9px 16px;border-radius:8px}
.pb-band-cta-soft{background:none;color:var(--teal-l);border:1px solid rgba(93,202,165,.4);padding:8px 15px}
.pb-consult{font-size:13px;color:rgba(247,243,237,.6);line-height:1.6;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.pb-consult a{color:var(--gold);text-decoration:underline;font-weight:600}
.paed-disclaimer{width:100%;max-width:500px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:0.75rem 1rem;font-family:Georgia,serif;font-size:0.78rem;font-style:italic;color:rgba(255,255,255,0.4);text-align:center;line-height:1.5}
</style>
</head>

// ── Scoring ───────────────────────────────────────────────────────────────────
function calc(a){
  const age=a.age||35, sex=a.sex||'other', isTeen=age<18;
  const menoBioMod=getMenoBio(a,sex,age), menoAgeMod=getMenoAge(a,sex,age);
  const teenHorMod=getTeenHor(a,sex,age);
  const hyperMod=a.hypermobility==='high'?-18:a.hypermobility==='moderate'?-8:a.hypermobility==='mild'?-3:0;
  const sportMod=a.sport_load==='high'?-12:a.sport_load==='none'?-8:0;
  const bioRaw=avg([a.metabolic_s??65,a.nutrition_s??65,a.sleep_s??65]);
  const bioAdj=clamp(bioRaw+menoBioMod+teenHorMod);
  const moveRaw=avg([a.stiffness_s??65,a.sitting_s??65]);
  const moveAdj=clamp(moveRaw+hyperMod);
  const strRaw=avg([a.strength_s??65,a.sit_stand_s??65]);
  const strAdj=clamp(strRaw+sportMod);
  const painRaw=a.pain!==undefined?a.pain:3;
  const injAdj=avg([clamp(100-painRaw*10),a.injury_s??80]);
  const genetic=a.family_s??65;
  const composite=(bioAdj*.22+moveAdj*.16+strAdj*.32+injAdj*.16+genetic*.14);
  const delta=Math.round((75-composite)*.38);
  let kneeAge=isTeen?age:Math.round(age+delta+menoAgeMod);
  if(!isTeen) kneeAge=Math.max(18,Math.min(kneeAge,90)); // floor at 18 for adults
  // For teens floor at actual age (joints still developing)
  if(isTeen) kneeAge=age;
  const jhs=Math.round(composite);
  return {
    isTeen,age,sex,kneeAge,jhs,diff:kneeAge-age,
    domains:{bio:Math.round(bioAdj),move:Math.round(moveAdj),strength:Math.round(strAdj),injury:Math.round(injAdj),genetic:Math.round(genetic)},
    familyRisk:a.family||'unsure',painLevel:painRaw,
    menoStatus:a.menopause||null,teenHorStatus:a.teen_hormonal||null,hypermobile:a.hypermobility||null
  };
}
function getMenoBio(a,sex,age){
  if(sex!=='female')return 0;
  const m=a.menopause;
  if(m==='peri')return -8; if(m==='post_nat')return -14;
  if(m==='post_early')return -22; if(m==='hrt')return -5;
  if(m==='pre')return 0;
  if(!m&&age>=50)return -12; if(!m&&age>=40)return -5; return 0;
}
function getMenoAge(a,sex,age){
  if(sex!=='female')return 0;
  const m=a.menopause;
  if(m==='peri')return 1; if(m==='post_nat')return 2;
  if(m==='post_early')return 4; if(m==='hrt')return 1;
  if(!m&&age>=50)return 2; if(!m&&age>=40)return 1; return 0;
}
function getTeenHor(a,sex,age){
  if(sex!=='female'||age>17)return 0;
  if(a.teen_hormonal==='absent')return -20;
  if(a.teen_hormonal==='irregular')return -8; return 0;
}
function avg(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}

// Get improvable years (potential)
function getImproveable(domains){
  const worst=Object.values(domains).filter(v=>v<60);

  if(worst.length>=3)return 10;

}

function buildPrimeBreakdown(domains){
  var CONSULT='https://www.ortholongevity.co.uk/book-an-appointment/';
  var GRAD_H='linear-gradient(90deg,#1d9e75,#5dcaa5,#c9a84c)';      // health: teal -> mint -> gold (higher = healthier)
  var GRAD_R='linear-gradient(90deg,#5dcaa5,#c9a84c,#c0703a)';      // risk: mint/gold -> terracotta (higher = more risk)
  var TIP='Based on family history. Genomic risk scoring coming soon.';
  function fillStyle(v,grad){
    var w=Math.max(3,Math.min(100,Math.round(v)));
    var size=Math.round(10000/w);
    return 'width:'+w+'%;background:'+grad+';background-size:'+size+'% 100%;background-position:left center;background-repeat:no-repeat';
  }
  function healthRow(letter,name,desc,v){
    return '<div class="pb-row">'
      +'<div class="pb-meta"><span class="pb-letter" aria-hidden="true">'+letter+'</span>'
      +'<span class="pb-name">'+name+'</span>'
      +'<span class="pb-score">'+Math.round(v)+'<span class="pb-score-max">/100</span></span></div>'
      +'<div class="pb-track"><div class="pb-fill" style="'+fillStyle(v,GRAD_H)+'"></div></div>'
      +'<div class="pb-desc">'+desc+'</div></div>';
  }
  var P=domains.strength||0, I=domains.injury||0, M=domains.move||0, E=domains.bio||0;
  var genetic=(domains.genetic==null?65:domains.genetic);
  var risk=Math.max(0,Math.min(100,100-genetic));               // displayed value: 100 - stored genetic
  var riskWord=risk<=33?'Low':risk<=66?'Moderate':'High';
  var band;
  if(risk<=33){
    band={key:'low',col:'#5dcaa5',head:'Low genetic risk',
      msg:'Your family history is working in your favour. That’s one advantage banked — keep your other four domains strong to hold onto it.',
      cta:'See your full PRIME profile',href:null};
  } else if(risk<=66){
    band={key:'mod',col:'#c9a84c',head:'Moderate genetic risk',
      msg:'A family history like yours doesn’t decide the outcome — it moves the timeline forward. The advantage is in acting earlier, not harder.',
      cta:'Book a consultation',href:CONSULT};
  } else {
    band={key:'high',col:'#c0703a',head:'High genetic risk',
      msg:'A strong family history raises urgency, not inevitability. The patients who do best are the ones who start before symptoms force the decision.',
      cta:'Book a consultation',href:CONSULT};
  }
  // Inverted Risk bar: high value = high risk, with explicit Low/Moderate/High scale + marker
  var markerPos=Math.max(3,Math.min(100,risk));
  var riskRow='<div class="pb-row pb-row-risk">'
    +'<div class="pb-meta"><span class="pb-letter" aria-hidden="true">R</span>'
    +'<span class="pb-name">Risk <button type="button" class="pb-info" aria-label="'+TIP+'" title="'+TIP+'">i</button></span>'
    +'<span class="pb-score" style="color:'+band.col+'">'+riskWord+'</span></div>'
    +'<div class="pb-track pb-track-risk" title="'+TIP+'"><div class="pb-fill" style="'+fillStyle(risk,GRAD_R)+'"></div>'
    +'<span class="pb-marker" style="left:'+markerPos+'%"></span></div>'
    +'<div class="pb-scale"><span>Low</span><span>Moderate</span><span>High</span></div>'
    +'<div class="pb-desc">Genetic Risk — higher reads as higher risk (the opposite of the bars above)</div></div>';
  // Risk-band message + calibrated next step
  var bandCta = band.href
    ? '<a class="pb-band-cta" href="'+band.href+'" target="_blank" rel="noopener">'+band.cta+' →</a>'
    : '<a class="pb-band-cta pb-band-cta-soft" href="#primeBreakdown" onclick="var el=document.getElementById(\'primeBreakdown\');if(el)el.scrollIntoView({behavior:\'smooth\'});return false;">'+band.cta+' ↓</a>';
  var bandBlock='<div class="pb-band" style="border-color:'+band.col+'40">'
    +'<div class="pb-band-head" style="color:'+band.col+'">'+band.head+'</div>'
    +'<div class="pb-band-msg">'+band.msg+'</div>'+bandCta+'</div>';

  return '<div class="prime-breakdown" id="primeBreakdown">'
    +'<div class="pb-h">Your PRIME breakdown</div>'
    +'<div class="pb-sub">The five domains behind your Knee Age.</div>'
    + healthRow('P','Power','Strength and force capacity',P)

function startQuiz(){
  phase='quiz'; qIdx=0; answers={};
  document.getElementById('app').innerHTML=`
    <div style="padding-top:16px">
      <div class="prog-wrap" id="pw">
        <div class="prog-top"><span class="prog-txt" id="pt">Question 1</span><span class="prog-pct" id="pp">0%</span></div>
        <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
      </div>
      <div id="mr"></div>
      <div id="qc"></div>
    </div>`;
  renderQ();
}

function updateProg(){
  const vq=visibleQs(answers), n=vq.length, pct=Math.round((qIdx/n)*100);
  const cur=Math.min(qIdx+1,n);
  const remaining=n-cur;
  document.getElementById('pt').textContent=
    remaining<=2&&remaining>0?`${Math.round(pct)}% complete — just ${remaining} question${remaining===1?'':'s'} left`:`Question ${cur} of ${n}`;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pp').textContent=pct+'%';
}

function renderQ(){
  const vq=visibleQs(answers);
  if(qIdx>=vq.length){showResult();return;}
  updateProg();
  const q=vq[qIdx];
  // Micro reward from previous question
  const prev=qIdx>0?vq[qIdx-1]:null;
  const mrEl=document.getElementById('mr');
  if(prev&&prev.reward){
    mrEl.innerHTML=`<div class="micro-reward">✦ ${prev.reward}</div>`;
  } else { mrEl.innerHTML=''; }
  const d=q.domain?dInfo(q.domain):null;
  const container=document.getElementById('qc');
  container.innerHTML='';
  const card=document.createElement('div');
  card.className='card';
  let h=`<div class="q-ey">${q.ey}</div>`;
  if(d) h+=`<div class="q-dbadge" style="background:${d.pb}33;color:${d.pc};border-color:${d.pbd}">
    <span style="width:7px;height:7px;border-radius:50%;background:${d.c};display:inline-block"></span>
    ${d.name}</div>`;
  h+=`<div class="q-txt">${q.txt}</div><div class="q-sub">${q.sub}</div>`;
  if(q.type==='options'){
    h+=`<div class="opts">`;
    q.opts.forEach(o=>{
      const s=answers[q.id]===o.v?' sel':'';
      h+=`<button class="opt${s}" onclick="selOpt(this,'${q.id}','${o.v}',${o.sc})">
        <div class="opt-ic">${o.ic}</div>
        <div><div class="opt-lbl">${o.lb}</div>${o.nt?`<div class="opt-note">${o.nt}</div>`:''}</div>
      </button>`;
    });
    h+=`</div>`;
  } else if(q.type==='slider'){
    const v=answers[q.id]||q.def;
    h+=`<div class="sl-wrap">
      <div class="sl-val" id="sv">${v}</div><div class="sl-unit">${q.unit}</div>
      <input type="range" min="${q.min}" max="${q.max}" value="${v}" step="1" id="si" oninput="updSl(this)"/>
      <div class="sl-lbls"><span>${q.lbls[0]}</span><span>${q.lbls[1]}</span></div>
    </div>`;
  } else if(q.type==='pain'){
    const v=answers[q.id]!==undefined?answers[q.id]:-1;
    h+=`<div class="pain-scale">`;
    for(let i=0;i<=10;i++) h+=`<button class="pbtn${v===i?' sel':''}" data-v="${i}" onclick="selPain(this,${i})">${i}</button>`;
    h+=`</div><div class="pain-lbls"><span>No pain</span><span>Severe</span></div>`;
  }
  const hasAns=answers[q.id]!==undefined,isSl=q.type==='slider';
  h+=`<div class="nxt-wrap">${qIdx>0?'<button class="back-btn" onclick="prevQ()">← Back</button>':''}<button class="nxt-btn${(hasAns||isSl)?' on':''}" id="nb" onclick="nextQ()">Continue →</button></div>`;
  card.innerHTML=h;
  container.appendChild(card);
  window._cq=q;
  if(isSl){answers[q.id]=answers[q.id]||q.def;document.getElementById('nb').classList.add('on');}
}

function selOpt(btn,qid,val,sc){
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  answers[qid]=val;answers[qid+'_s']=sc;
  document.getElementById('nb').classList.add('on');
}
function selPain(btn,val){
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  answers.pain=val;answers.pain_s=Math.max(0,100-val*10);
  document.getElementById('nb').classList.add('on');
}
function updSl(inp){
  document.getElementById('sv').textContent=inp.value;
  answers[window._cq.id]=parseInt(inp.value);
}
function nextQ(){
  const q=window._cq;
  if(q.type==='options'&&answers[q.id]===undefined)return;
  if(q.type==='pain'&&answers[q.id]===undefined)return;
  qIdx++;renderQ();
}
function prevQ(){
  if(qIdx>0){qIdx--;renderQ();}
}

function scDivider(ctx, y) {
  ctx.beginPath(); ctx.moveTo(80, y); ctx.lineTo(1000, y);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.5; ctx.stroke();
}

function scRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function scDots(ctx, accentHex) {
  ctx.fillStyle = accentHex + '11';
  for (let x=40; x<1080; x+=40)
    for (let y=40; y<1080; y+=40) {
      ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
    }
}

function scWrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', cy = y;
  words.forEach((word, i) => {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxW && line !== '') {
      ctx.fillText(line.trim(), x, cy); cy += lineH; line = word + ' ';
    } else { line = test; }
    if (i === words.length - 1) ctx.fillText(line.trim(), x, cy);
  });
}

function scBadge(ctx, label, tier, y) {
  ctx.font = 'bold 19px Georgia, serif';
  const badgeW = Math.max(240, ctx.measureText(label).width + 70);
  const badgeX = 540 - badgeW / 2;
  scRoundRect(ctx, badgeX, y, badgeW, 48, 24);
  ctx.fillStyle = tier.badgeBg; ctx.fill();
  ctx.fillStyle = tier.badgeText;
  ctx.textAlign = 'center';
  ctx.fillText(label, 540, y + 31);
}

function scPillarBars(ctx, pillarsData, tier, startY) {
  const barGap=52, barX=340, barW=580, barH=9;
  pillarsData.forEach((p, i) => {
    const rowY = startY + i * barGap;
    ctx.textAlign='left'; ctx.fillStyle=tier.textSecondary;
    ctx.font='20px Georgia, serif'; ctx.fillText(p.label, 80, rowY);
    scRoundRect(ctx, barX, rowY-barH+2, barW, barH, 4);
    ctx.fillStyle=tier.trackFill; ctx.fill();
    const fillW = Math.max(8, (p.value/100)*barW);
    scRoundRect(ctx, barX, rowY-barH+2, fillW, barH, 4);
    ctx.fillStyle=tier.accent; ctx.fill();
    ctx.textAlign='right'; ctx.fillStyle=tier.accent;
    ctx.font='bold 20px Georgia, serif';
    ctx.fillText(p.value+'%', 1000, rowY);
  });
}

// Brand palette only. Leads with the age GAP. PRIME bars wired to real
// domains{}; Risk bar inverted (100 - genetic). fmt: 'square' | 'story'.
function buildPrimeShareCard(kneeAge, age, domains, fmt){
  fmt = fmt || 'square';
  var W=1080, H = fmt==='story' ? 1920 : 1080;
  var FOREST='#0f2d1e', GOLD='#c9a84c', CREAM='#f7f3ed', MINT='#5dcaa5', TEAL='#1d9e75', TERRA='#c0703a';
  var SEC='rgba(247,243,237,0.62)';
  var clip100=function(v){ return Math.max(0, Math.min(100, Math.round(v==null?0:v))); };
  var cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H;
  var ctx=cvs.getContext('2d'); var cx=W/2;

  // Background + subtle gold dot texture + thin gold frame
  ctx.fillStyle=FOREST; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=GOLD+'10';
  for(var dx=44; dx<W; dx+=44) for(var dy=44; dy<H; dy+=44){ ctx.beginPath(); ctx.arc(dx,dy,1.1,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='rgba(201,168,76,0.35)'; ctx.lineWidth=3; ctx.strokeRect(20,20,W-40,H-40);

  // Anchors per format
  var A = fmt==='story'
    ? {l1:360, big:540, l3:660, fitW:960, bigStart:124, l1px:46, kne:790, kpx:34, div1:880, bars:1010, gap:104, barH:14, div2:1500, lock1:1580, lock2:1632, cta:1770, ctapx:30}
    : {l1:212, big:328, l3:402, fitW:920, bigStart:96,  l1px:42, kne:478, kpx:29, div1:528, bars:602,  gap:58,  barH:12, div2:872,  lock1:922,  lock2:962,  cta:1024, ctapx:26};

  function divider(y){ ctx.strokeStyle='rgba(201,168,76,0.22)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(140,y); ctx.lineTo(W-140,y); ctx.stroke(); }
  function fitFont(text,weight,maxW,startPx){ var px=startPx; ctx.font=weight+' '+px+'px Georgia, serif'; while(ctx.measureText(text).width>maxW && px>40){ px-=2; ctx.font=weight+' '+px+'px Georgia, serif'; } return px; }

  // HERO — the gap is the headline
  var diff=kneeAge-age;
  var l1, big, l3;
  if(diff>0){ l1='My knees are'; big=Math.abs(diff)+(Math.abs(diff)===1?' year older':' years older'); l3='than me'; }
  else if(diff<0){ l1='My knees are'; big=Math.abs(diff)+(Math.abs(diff)===1?' year younger':' years younger'); l3='than me'; }
  else { l1='My knees'; big='match my age'; l3=''; }

  ctx.textAlign='center';
  ctx.fillStyle=CREAM; ctx.font='italic '+A.l1px+'px Georgia, serif'; ctx.fillText(l1, cx, A.l1);
  var bigPx=fitFont(big,'bold',A.fitW,A.bigStart);
  ctx.fillStyle=GOLD; ctx.font='bold '+bigPx+'px Georgia, serif'; ctx.fillText(big, cx, A.big);
  if(l3){ ctx.fillStyle=CREAM; ctx.font='italic '+A.l1px+'px Georgia, serif'; ctx.fillText(l3, cx, A.l3); }

  // Knee Age X · Actual age Y
  ctx.fillStyle=SEC; ctx.font=A.kpx+'px Georgia, serif';
  ctx.fillText('Knee Age '+kneeAge+'   ·   Actual age '+age, cx, A.kne);

  divider(A.div1);

  // PRIME bars — same colours/direction as the results screen
  var rows=[
    {ltr:'P', name:'Power',                 v:clip100(domains.strength),            kind:'health'},
    {ltr:'R', name:'Risk',                  v:clip100(100-(domains.genetic==null?65:domains.genetic)), kind:'risk'},
    {ltr:'I', name:'Injury',                v:clip100(domains.injury),              kind:'health'},
    {ltr:'M', name:'Movement',              v:clip100(domains.move),                kind:'health'},
    {ltr:'E', name:'Endocrine & Metabolic', v:clip100(domains.bio),                 kind:'health'}
  ];
  var x0=92, letterW=42, barX=372, barW=556, valX=W-92, barH=A.barH;
  rows.forEach(function(r,i){
    var rowY=A.bars + i*A.gap;
    ctx.textAlign='left';
    ctx.font='bold 30px Georgia, serif'; ctx.fillStyle=GOLD; ctx.fillText(r.ltr, x0, rowY);
    ctx.font='23px Georgia, serif'; ctx.fillStyle='rgba(247,243,237,0.82)'; ctx.fillText(r.name, x0+letterW, rowY);
    var by=rowY-barH-1;
    scRoundRect(ctx,barX,by,barW,barH,barH/2); ctx.fillStyle='rgba(255,255,255,0.09)'; ctx.fill();
    var grad=ctx.createLinearGradient(barX,0,barX+barW,0);
    if(r.kind==='risk'){ grad.addColorStop(0,MINT); grad.addColorStop(0.5,GOLD); grad.addColorStop(1,TERRA); }
    else { grad.addColorStop(0,TEAL); grad.addColorStop(0.5,MINT); grad.addColorStop(1,GOLD); }
    var fw=Math.max(barH, (r.v/100)*barW);
    ctx.save(); scRoundRect(ctx,barX,by,fw,barH,barH/2); ctx.clip(); ctx.fillStyle=grad; ctx.fillRect(barX,by,barW,barH); ctx.restore();
    ctx.textAlign='right'; ctx.font='bold 24px Georgia, serif';
    if(r.kind==='risk'){ var w=r.v<=33?'Low':r.v<=66?'Moderate':'High'; ctx.fillStyle=(r.v<=33?MINT:r.v<=66?GOLD:TERRA); ctx.fillText(w, valX, rowY); }
    else { ctx.fillStyle=GOLD; ctx.fillText(String(r.v), valX, rowY); }
  });

  divider(A.div2);

  // Brand lockup
  ctx.textAlign='center';
  ctx.fillStyle=GOLD; ctx.font='bold 33px Georgia, serif'; ctx.fillText('OrthoLongevity™', cx, A.lock1);
  ctx.fillStyle=SEC; ctx.font='20px Georgia, serif'; ctx.fillText('Dr Arj Imbuldeniya · Consultant Orthopaedic Knee & Hip Surgeon', cx, A.lock2);

  // CTA
  ctx.fillStyle=GOLD; ctx.font='bold '+A.ctapx+'px Georgia, serif';
  ctx.fillText('Find your Knee Age free in 60 seconds — kneeage.com', cx, A.cta);

  return cvs;
}

function scTriggerDownload(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename || 'my-knee-age-scorecard.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function scShowToast(msg) {
  const old = document.querySelector('.share-toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'share-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4000);
}

async function scShareCard(canvas, caption, filename) {
  if (navigator.canShare) {
    canvas.toBlob(async function(blob) {
      const file = new File([blob], filename||'my-knee-age.png', {type:'image/png'});
      try {
        await navigator.share({title:'My Knee Age \u2014 OrthoLongevity\u2122', text:caption, files:[file]});
      } catch(e) {
        if (e.name !== 'AbortError') {
          scTriggerDownload(canvas, filename);
          scShowToast('Image saved \u2014 attach it to WhatsApp or Snapchat manually');
        }
      }
    }, 'image/png');
  } else {
    scTriggerDownload(canvas, filename);
    scShowToast('Image saved to Downloads \u2014 attach it manually to WhatsApp or Snapchat');
  }
}

// ── SCORE CARD CANVAS GENERATOR (1080x1080) ─────────────────────────────

function downloadScoreCardPNG(){
  const R=calc(answers);
  const {isTeen,age,kneeAge,jhs,diff,domains}=R;
  if(!isTeen){ scTriggerDownload(buildPrimeShareCard(kneeAge,age,domains,'square'),'my-knee-age.png'); return; }
  const tierKey=getAdultTierKey(diff);
  const status=getStatus(diff,isTeen,jhs,age);
  const ageGap=Math.abs(diff);

  const W=1080,H=1080;
  const cvs=document.createElement('canvas');
  cvs.width=W;cvs.height=H;
  const ctx=cvs.getContext('2d');

  // Tier-based background
  const bgColors={elite:'#1E4D3B',above:'#1E4D3B',average:'#2A6B52',adjust:'#C97A2A',attention:'#B94040'};
  const bg=bgColors[tierKey]||'#1E4D3B';
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Gold border
  ctx.strokeStyle='#C9A84C';
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,W-6,H-6);

  // Top third — OrthoLongevity™ branding
  ctx.font='bold 48px Georgia, serif';
  ctx.fillStyle='#C9A84C';
  ctx.textAlign='center';
  ctx.fillText('OrthoLongevity\u2122',W/2,100);

  // "KNEE AGE™" label above number
  ctx.font='bold 28px Georgia, serif';
  ctx.fillStyle='#C9A84C';
  ctx.textAlign='center';
  ctx.fillText('KNEE AGE\u2122',W/2,300);

  // Large Knee Age number
  const mainNum=isTeen?String(jhs):String(kneeAge);
  ctx.font='bold 240px Georgia, serif';
  ctx.fillStyle='#FFFFFF';
  ctx.textAlign='center';
  ctx.fillText(mainNum,W/2,530);

  // "You are [age]" below
  ctx.font='32px Georgia, serif';
  ctx.fillStyle='#F5F0E6';
  ctx.fillText('You are '+age,W/2,590);

  // Tier badge — gold rounded rectangle
  const tierLabels={elite:'Elite',above:'Above Average',average:'Average',adjust:'Needs Adjustment',attention:'Needs Attention'};
  const tierLabel=tierLabels[tierKey]||'Average';
  ctx.font='bold 26px Georgia, serif';
  const badgeW=ctx.measureText(tierLabel).width+60;
  const badgeX=(W-badgeW)/2;
  const badgeY=620;
  const badgeH=50;
  const br=25;
  ctx.fillStyle='#C9A84C';
  ctx.beginPath();
  ctx.moveTo(badgeX+br,badgeY);ctx.lineTo(badgeX+badgeW-br,badgeY);
  ctx.arcTo(badgeX+badgeW,badgeY,badgeX+badgeW,badgeY+br,br);
  ctx.lineTo(badgeX+badgeW,badgeY+badgeH-br);
  ctx.arcTo(badgeX+badgeW,badgeY+badgeH,badgeX+badgeW-br,badgeY+badgeH,br);
  ctx.lineTo(badgeX+br,badgeY+badgeH);
  ctx.arcTo(badgeX,badgeY+badgeH,badgeX,badgeY+badgeH-br,br);
  ctx.lineTo(badgeX,badgeY+br);
  ctx.arcTo(badgeX,badgeY,badgeX+br,badgeY,br);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle=bg;
  ctx.textAlign='center';
  ctx.fillText(tierLabel,W/2,badgeY+35);

  // Tier copy line
  const tierCopy={
    elite:'My joints are '+ageGap+' years younger than they should be.',
    above:'Ahead of my age \u2014 and improving.',
    average:'Right at average. Now I know what to change.',
    adjust:'My joints are ageing faster than they should. Finding out was step one.',
    attention:'This was a wake-up call. Exactly the right time to find out.'
  };
  const copyLine=tierCopy[tierKey]||tierCopy.average;
  ctx.font='italic 26px Georgia, serif';
  ctx.fillStyle='#F5F0E6';
  ctx.textAlign='center';
  // Word wrap the copy line
  const copyWords=copyLine.split(' ');
  let cLine='',cLines=[],cMaxW=W-120;
  for(const w of copyWords){
    const t=cLine+w+' ';
    if(ctx.measureText(t).width>cMaxW&&cLine){cLines.push(cLine.trim());cLine=w+' ';}
    else cLine=t;
  }
  if(cLine)cLines.push(cLine.trim());
  const cStartY=720;
  cLines.forEach((l,i)=>ctx.fillText(l,W/2,cStartY+i*36));

  // Bottom — CTA
  const bottomY=cStartY+cLines.length*36+60;
  ctx.font='32px Georgia, serif';
  ctx.fillStyle='#F5F0E6';
  ctx.fillText('What\u2019s your Knee Age?',W/2,bottomY);

  ctx.font='bold 34px Georgia, serif';
  ctx.fillStyle='#C9A84C';
  ctx.fillText('kneeage.com',W/2,bottomY+50);

  // Trigger download
  const a=document.createElement('a');
  a.href=cvs.toDataURL('image/png');
  a.download='knee-age-score.png';
  a.click();
}

function isEmailCompleted(email){
  try{
    const done = JSON.parse(localStorage.getItem('kneeage_completed_emails')||'[]');
    return done.includes(email.toLowerCase());
  }catch(e){return false;}
}

function submitEmail(){
  const inp = document.getElementById('emailInput');
  if(!inp) return;
  const val = inp.value.trim();
  if(!val || !val.includes('@')){
    inp.style.borderColor='rgba(224,85,85,.6)';
    inp.placeholder='Please enter a valid email';
    return;
  }
  if(isEmailCompleted(val)){
    showEmailBlockedMessage();
    return;
  }
  userEmail = val;
  sendToKit(val);
  startQuizFromGate();
}

function showEmailBlockedMessage(){
  document.getElementById('app').innerHTML=`
    <div style="padding-top:48px;text-align:center;animation:fu .4s ease both">
      <div style="font-size:36px;margin-bottom:18px">✓</div>
      <div style="font-family:var(--fd);font-size:24px;font-weight:700;color:var(--cream);line-height:1.3;margin-bottom:12px">You have already completed<br/>this assessment.</div>
      <div style="font-size:14px;color:rgba(247,243,237,.6);line-height:1.6;max-width:360px;margin:0 auto 28px">To take it again please use a different email address.</div>
      <button onclick="showHook()" style="background:none;border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:13px 28px;font-family:var(--fb);font-size:15px;font-weight:500;cursor:pointer;color:var(--muted);transition:background .2s,border-color .2s">← Go back</button>
    </div>`;
}

function skipEmail(){
  userEmail = '';
  startQuizFromGate();
}

function sendToKit(email, kneeAge, score){
  // Updates Kit subscriber custom fields with their quiz result
  // Uses Vercel Edge Function at /api/subscribe
  // Only fires if we have an email (from URL param or email gate)
  if(!email) return;
  fetch('/api/subscribe',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      email,
      tags:['knee-age-quiz-completed'],
      kneeAge: kneeAge||'',
      score: score||''
    })
  }).catch(()=>{});
}

function startQuizFromGate(){
  phase='quiz'; qIdx=0; answers={};
  answers._email = userEmail;
  document.getElementById('app').innerHTML=`
    <div style="padding-top:16px">
      <div class="prog-wrap" id="pw">
        <div class="prog-top"><span class="prog-txt" id="pt">Question 1</span><span class="prog-pct" id="pp">0%</span></div>

      </div>
      <div id="mr"></div>
      <div id="qc"></div>

  renderQ();
}

  if(emailParam && emailParam.includes('@')){

showHook();
