<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Know Your Knee Age — OrthoLongevity™</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --forest:#0f2d1e;--forest-mid:#1a3d2a;
  --teal:#1d9e75;--teal-light:#5dcaa5;--teal-pale:#e1f5ee;
  --cream:#f7f3ed;--muted:#6b7c71;
  --gold:#c9a84c;--white:#ffffff;
  --red:#e05555;--amber:#e09a3a;--green:#27a96c;
  /* Domain colours */
  --d1:#085041; --d1-bg:#e1f5ee; --d1-mid:#1d9e75;
  --d2:#27500a; --d2-bg:#eaf3de; --d2-mid:#639922;
  --d3:#633806; --d3-bg:#faeeda; --d3-mid:#ba7517;
  --d4:#791f1f; --d4-bg:#fcebeb; --d4-mid:#e24b4a;
  --d5:#3c3489; --d5-bg:#eeedfe; --d5-mid:#7f77dd;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--forest);color:var(--cream);font-family:var(--font-body);font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.shell{width:100%;max-width:580px;margin:0 auto}

.hdr{text-align:center;padding:36px 0 28px;animation:fadeup 0.5s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hdr-logo{font-family:var(--font-display);font-size:20px;color:var(--cream);margin-bottom:4px}
.hdr-logo span{color:var(--teal-light)}
.hdr-tag{font-size:12px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase}

.trust-strip{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px 20px;margin-bottom:28px;animation:fadeup 0.5s 0.1s ease both}
.trust-name{font-size:13px;font-weight:600;color:var(--cream);font-family:var(--font-display);line-height:1.2;margin-bottom:2px}
.trust-role{font-size:11px;color:rgba(247,243,237,0.55);line-height:1.5}
.trust-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:100px;padding:2px 9px;font-size:10px;color:var(--gold);margin-top:5px;font-weight:500}

.progress-wrap{margin-bottom:32px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.progress-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-light));border-radius:2px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1)}

.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:36px;margin-bottom:16px;animation:cardIn 0.35s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.q-eyebrow{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal-light);margin-bottom:10px}
.q-domain-badge{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:4px 12px;font-size:11px;font-weight:500;margin-bottom:14px;border:1px solid}
.q-text{font-family:var(--font-display);font-size:clamp(19px,4vw,25px);font-weight:700;color:var(--cream);line-height:1.3;margin-bottom:8px}
.q-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.5}

.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 20px;cursor:pointer;transition:border-color 0.2s,background 0.2s,transform 0.15s;text-align:left;width:100%;font-family:var(--font-body);color:var(--cream)}
.opt:hover{border-color:rgba(29,158,117,0.5);background:rgba(29,158,117,0.07);transform:translateX(3px)}
.opt.selected{border-color:var(--teal);background:rgba(29,158,117,0.15)}
.opt-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.opt.selected .opt-icon{background:rgba(29,158,117,0.2)}
.opt-label{font-size:15px;font-weight:400;color:var(--cream)}
.opt-note{font-size:11px;color:var(--muted);margin-top:2px}

.slider-wrap{margin-top:8px}
.slider-val{font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--teal-light);text-align:center;margin-bottom:4px;line-height:1}
.slider-unit{font-size:14px;color:var(--muted);text-align:center;margin-bottom:20px}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--teal);cursor:pointer;box-shadow:0 2px 8px rgba(29,158,117,0.4)}
.slider-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}

.pain-scale{display:flex;gap:5px;margin-top:8px}
.pain-btn{flex:1;aspect-ratio:1;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all 0.15s;font-family:var(--font-body)}
.pain-btn.selected{color:var(--cream);font-weight:600}
.pain-btn[data-v="0"].selected,.pain-btn[data-v="1"].selected,.pain-btn[data-v="2"].selected,.pain-btn[data-v="3"].selected{background:rgba(39,169,108,0.25);border-color:var(--green)}
.pain-btn[data-v="4"].selected,.pain-btn[data-v="5"].selected,.pain-btn[data-v="6"].selected{background:rgba(224,154,58,0.25);border-color:var(--amber)}
.pain-btn[data-v="7"].selected,.pain-btn[data-v="8"].selected,.pain-btn[data-v="9"].selected,.pain-btn[data-v="10"].selected{background:rgba(224,85,85,0.25);border-color:var(--red)}
.pain-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}

.next-wrap{margin-top:24px;text-align:right}
.next-btn{background:var(--teal);color:var(--white);border:none;border-radius:100px;padding:14px 32px;font-family:var(--font-body);font-size:15px;font-weight:500;cursor:pointer;transition:background 0.2s,transform 0.15s;opacity:0.4;pointer-events:none}
.next-btn.active{opacity:1;pointer-events:all}
.next-btn.active:hover{background:#159060;transform:translateY(-2px)}

/* RESULT */
.result-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:40px 36px;animation:cardIn 0.4s ease both;text-align:center}
.result-label{font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal-light);margin-bottom:16px}
.result-ring{width:180px;height:180px;margin:0 auto 24px;position:relative}
.result-ring svg{width:180px;height:180px}
.result-centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result-age{font-family:var(--font-display);font-size:56px;font-weight:700;line-height:1}
.result-age-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:3px}
.result-compare{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px}
.rc-box{text-align:center;padding:14px 24px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px}
.rc-box.hl{background:rgba(29,158,117,0.15);border-color:rgba(29,158,117,0.4)}
.rc-val{font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--cream)}
.rc-box.hl .rc-val{color:var(--teal-light)}
.rc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px}
.rc-arrow{font-size:22px;color:var(--muted)}
.result-verdict{font-family:var(--font-display);font-size:22px;font-style:italic;color:var(--cream);margin-bottom:8px}
.result-body{font-size:14px;color:rgba(247,243,237,0.6);line-height:1.7;margin-bottom:28px;max-width:480px;margin-left:auto;margin-right:auto}

/* DOMAIN BARS */
.domains-title{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;text-align:left}
.domain-row{margin-bottom:14px}
.domain-row-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.domain-name-wrap{display:flex;align-items:center;gap:8px}
.domain-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.domain-name-text{font-size:13px;font-weight:500;color:var(--cream)}
.domain-stage-pill{font-size:9px;font-weight:500;letter-spacing:0.04em;padding:2px 7px;border-radius:100px;border:1px solid}
.domain-score-wrap{display:flex;align-items:center;gap:8px}
.domain-score{font-size:13px;font-weight:600;color:var(--cream)}
.domain-tag{font-size:9px;font-weight:500;letter-spacing:0.04em;padding:1px 7px;border-radius:100px;border:1px solid}
.domain-tag.good{background:rgba(39,169,108,0.15);color:#5dcaa5;border-color:rgba(39,169,108,0.3)}
.domain-tag.warn{background:rgba(224,154,58,0.15);color:#e09a3a;border-color:rgba(224,154,58,0.3)}
.domain-tag.risk{background:rgba(224,85,85,0.15);color:#e05555;border-color:rgba(224,85,85,0.3)}
.domain-bar{height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden}
.domain-fill{height:100%;border-radius:4px;transition:width 1.3s cubic-bezier(0.4,0,0.2,1)}
.domain-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;text-align:left}

/* GENETIC PANEL */
.genetic-panel{border-radius:14px;padding:16px 18px;margin-bottom:8px;text-align:left}
.gp-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gp-icon{font-size:16px}
.gp-title{font-size:13px;font-weight:600}
.gp-body{font-size:12px;color:rgba(247,243,237,0.65);line-height:1.6;margin:0 0 6px}
.gp-cta{display:inline-block;font-size:10px;font-weight:500;letter-spacing:0.05em;padding:3px 10px;border-radius:100px}

/* ACTIONS */
.actions-title{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;text-align:left;margin-top:24px}
.action-item{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:16px;margin-bottom:8px;text-align:left;border:1px solid rgba(255,255,255,0.08)}
.ai-icon-wrap{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ai-title{font-size:14px;font-weight:500;color:var(--cream);margin-bottom:3px}
.ai-sub{font-size:12px;color:var(--muted);line-height:1.5}
.ai-pill{display:inline-block;font-size:10px;font-weight:500;letter-spacing:0.05em;padding:2px 8px;border-radius:100px;margin-top:5px;border:1px solid}

/* CTA */
.wl-cta{background:rgba(15,45,30,0.95);border:1px solid rgba(29,158,117,0.4);border-radius:22px;padding:32px;margin-top:24px;text-align:center}
.wl-cta-eyebrow{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal-light);margin-bottom:12px}
.wl-cta h3{font-family:var(--font-display);font-size:clamp(22px,4vw,28px);font-weight:700;color:var(--cream);margin-bottom:10px;line-height:1.2}
.wl-cta h3 em{font-style:italic;color:var(--teal-light)}
.wl-feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.wl-feat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:5px 12px;font-size:12px;color:rgba(247,243,237,0.7)}
.wl-success{padding:16px;background:rgba(29,158,117,0.12);border:1px solid rgba(29,158,117,0.3);border-radius:14px;margin-bottom:14px}
.wl-success-tick{font-size:26px;margin-bottom:4px}
.wl-success-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--cream);margin-bottom:3px}
.wl-success-body{font-size:13px;color:rgba(247,243,237,0.6);line-height:1.6}
.wl-proof{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;font-size:12px;color:var(--muted)}
.wl-proof-count{color:var(--teal-light);font-weight:600}
.social-link{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 16px;margin-bottom:8px;text-decoration:none;cursor:pointer}
.social-link:hover{background:rgba(29,158,117,0.08);border-color:rgba(29,158,117,0.3)}
.social-icon{width:34px;height:34px;border-radius:9px;background:rgba(29,158,117,0.15);border:1px solid rgba(29,158,117,0.2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.social-name{font-size:13px;font-weight:500;color:var(--cream);line-height:1.2}
.social-desc{font-size:11px;color:var(--muted);margin-top:1px}
.social-arrow{margin-left:auto;color:var(--teal-light);font-size:15px;flex-shrink:0}
.disclaimer{font-size:11px;color:var(--muted);opacity:0.5;text-align:center;margin-top:18px;line-height:1.6;padding:0 8px}

@media(max-width:480px){
  body{padding:12px}
  .card,.result-card,.wl-cta{padding:24px 18px}
  .pain-scale{gap:3px}
  .pain-btn{font-size:10px}
}
</style>
</head>
<body>
<div class="shell">

<div class="hdr">
  <div class="hdr-logo">Ortho<span>Longevity™</span></div>
  <div class="hdr-tag" style="margin-top:4px">Know Your Knee Age · Free Assessment</div>
</div>

<div class="trust-strip">
  <div>
    <div class="trust-name">Dr Arj Imbuldeniya</div>
    <div class="trust-role">FRCS(Tr&amp;Orth) · Consultant Orthopaedic Knee &amp; Hip Surgeon<br/>Chelsea &amp; Westminster NHS · 25 years in practice</div>
    <div class="trust-badge">🏥 Founder, OrthoLongevity™ · Lanserhof Mayfair</div>
  </div>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-label">
    <span id="progressText">Question 1 of 12</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div id="quizContainer"></div>
</div>

<script>
// ── Domain definitions ────────────────────────────────────────────────────────
const DOMAINS = [
  { key:'bio',      name:'Biological health',           stage:'R — Reset Biology',         color:'#1d9e75', dotColor:'#1d9e75', bg:'rgba(29,158,117,0.12)', border:'rgba(29,158,117,0.3)', pillColor:'#085041', pillBg:'#e1f5ee', pillBorder:'#5dcaa5' },
  { key:'move',     name:'Movement quality',             stage:'E — Enhance Movement',       color:'#639922', dotColor:'#639922', bg:'rgba(99,153,34,0.12)',  border:'rgba(99,153,34,0.3)',  pillColor:'#27500a', pillBg:'#eaf3de', pillBorder:'#97c459' },
  { key:'strength', name:'Muscle strength & capacity',  stage:'P — Power',                  color:'#ba7517', dotColor:'#ba7517', bg:'rgba(186,117,23,0.12)', border:'rgba(186,117,23,0.3)', pillColor:'#633806', pillBg:'#faeeda', pillBorder:'#ef9f27' },
  { key:'injury',   name:'Joint & injury history',       stage:'Phenotype + History',        color:'#e24b4a', dotColor:'#e24b4a', bg:'rgba(226,75,74,0.12)',  border:'rgba(226,75,74,0.3)',  pillColor:'#791f1f', pillBg:'#fcebeb', pillBorder:'#f09595' },
  { key:'genetic',  name:'Genetic & longevity risk',    stage:'R — Resilience + Genomics',  color:'#7f77dd', dotColor:'#7f77dd', bg:'rgba(127,119,221,0.12)',border:'rgba(127,119,221,0.3)',pillColor:'#3c3489', pillBg:'#eeedfe', pillBorder:'#afa9ec' },
];

// ── Questions (12 total, each tagged with domain key) ─────────────────────────
const QUESTIONS = [
  { id:'age', type:'slider', domain:null,
    eyebrow:'About you', text:'How old are you?',
    sub:'Your Knee Age is measured against this baseline.',
    min:18, max:85, default:45, unit:'years old', labels:['18','85'] },

  { id:'sex', type:'options', domain:null,
    eyebrow:'About you', text:'What is your biological sex?',
    sub:'Hormonal profile and cartilage norms differ between sexes — this calibrates your scoring.',
    options:[
      {value:'male',   icon:'♂', label:'Male', score:0},
      {value:'female', icon:'♀', label:'Female', score:0},
      {value:'other',  icon:'◯', label:'Prefer not to say', note:"Population-average norms used", score:0}
    ]},

  // Biological health (domain: bio)
  { id:'metabolic', type:'options', domain:'bio',
    eyebrow:'Biological health',
    text:'How would you describe your weight and metabolic health?',
    sub:'Excess adipose tissue produces inflammatory cytokines that directly accelerate cartilage breakdown and impair the joint\'s repair environment.',
    options:[
      {value:'healthy',   icon:'✅', label:'Healthy weight, no metabolic concerns', score:100},
      {value:'over_mild', icon:'📊', label:'Slightly overweight, broadly healthy', score:65},
      {value:'over_mod',  icon:'📈', label:'Moderately overweight, or pre-diabetic', score:35},
      {value:'obese',     icon:'⚠️', label:'Significantly overweight, or type 2 diabetes', score:10}
    ]},

  { id:'nutrition', type:'options', domain:'bio',
    eyebrow:'Biological health',
    text:'How would you describe your diet most of the time?',
    sub:'Omega-3s, polyphenols, and adequate protein are the most evidence-backed nutritional inputs for joint repair. Ultra-processed diets drive systemic inflammation independently of weight.',
    options:[
      {value:'anti',      icon:'🥗', label:'Mostly anti-inflammatory', note:'Oily fish, veg, olive oil, minimal processed food', score:100},
      {value:'balanced',  icon:'⚖️', label:'Broadly balanced', score:65},
      {value:'processed', icon:'🍟', label:'Mostly convenience or processed food', score:20},
      {value:'unsure',    icon:'❓', label:'Not sure / varies a lot', score:50}
    ]},

  { id:'sleep', type:'options', domain:'bio',
    eyebrow:'Biological health',
    text:'How much sleep do you typically get?',
    sub:'Cartilage remodelling is sleep-dependent. Chronic under-sleep elevates hs-CRP — a direct marker of the systemic inflammation that drives joint degeneration.',
    options:[
      {value:'good', icon:'😴', label:'7–9 hours most nights', score:100},
      {value:'ok',   icon:'🌙', label:'6–7 hours', score:58},
      {value:'poor', icon:'⚠️', label:'Under 6 hours most nights', score:12}
    ]},

  // Movement quality (domain: move)
  { id:'stiffness', type:'options', domain:'move',
    eyebrow:'Movement quality',
    text:'Do you experience morning stiffness or restricted movement in your knees or hips?',
    sub:'Morning stiffness lasting more than 30 minutes suggests an inflammatory pattern. Under 30 minutes is typical of OA. Both are modifiable with the right programme.',
    options:[
      {value:'none',     icon:'✅', label:'No stiffness or restriction', score:100},
      {value:'mild',     icon:'🌅', label:'Mild stiffness, resolves within 30 minutes', score:65},
      {value:'moderate', icon:'🔒', label:'Noticeable stiffness most days', score:35},
      {value:'severe',   icon:'⚠️', label:'Significant restriction that limits daily activities', score:10}
    ]},

  { id:'sitting', type:'options', domain:'move',
    eyebrow:'Movement quality',
    text:'How much time do you spend sitting each day?',
    sub:'Prolonged sitting reduces synovial fluid circulation and is independently associated with cartilage thinning — even in people who exercise regularly outside of sedentary work.',
    options:[
      {value:'active',    icon:'🔄', label:'I move regularly throughout the day', score:100},
      {value:'moderate',  icon:'⚖️', label:'3–5 hours sitting, with movement breaks', score:70},
      {value:'sedentary', icon:'💻', label:'6+ hours sitting most days', note:'Desk work, commuting, limited breaks', score:28},
      {value:'mostly',    icon:'🛋️', label:'Mostly sedentary — mobility is limited', score:8}
    ]},

  // Muscle strength & capacity (domain: strength)
  { id:'strength', type:'options', domain:'strength',
    eyebrow:'Muscle strength & capacity',
    text:'How would you describe your current strength and resistance training?',
    sub:'Quadriceps weakness is one of the most powerful independent predictors of knee OA progression. Strength training 2–3 times per week is the highest-evidence modifiable intervention for joint longevity.',
    options:[
      {value:'regular',   icon:'🏋️', label:'Structured strength training 3+ times per week', score:100},
      {value:'moderate',  icon:'🚴', label:'Some resistance work, 1–2 times per week', score:65},
      {value:'light',     icon:'🚶', label:'Mostly walking or light activity, no resistance work', score:32},
      {value:'sedentary', icon:'🪑', label:'Largely inactive', score:8}
    ]},

  { id:'sit_stand', type:'options', domain:'strength',
    eyebrow:'Muscle strength & capacity',
    text:'How many times can you stand from a chair and sit back down in 30 seconds — without using your arms?',
    sub:'The 30-second sit-to-stand test is a validated clinical measure of lower-limb power. Under 12 indicates significant impairment; under 8 is associated with rapid OA progression.',
    options:[
      {value:'high',   icon:'💪', label:'15 or more', score:100},
      {value:'good',   icon:'✅', label:'12–14', score:75},
      {value:'low',    icon:'📉', label:'8–11', score:40},
      {value:'poor',   icon:'⚠️', label:'Under 8, or I cannot do this without arm support', score:8},
      {value:'unsure', icon:'❓', label:"Haven't tried — not sure", score:50}
    ]},

  // Joint & injury history (domain: injury)
  { id:'pain', type:'pain', domain:'injury',
    eyebrow:'Joint & injury history',
    text:'Rate any knee or hip pain you have experienced in the last month.',
    sub:'0 = none at all. 10 = severe, limiting daily activity. Current pain level contributes to your joint history profile.'},

  { id:'injury', type:'options', domain:'injury',
    eyebrow:'Joint & injury history',
    text:'Any previous significant knee injury or surgery?',
    sub:'Previous ACL tears, meniscal damage, or cartilage injury alter local joint mechanics and the biological repair environment — sometimes permanently. This changes the clinical calculation even when imaging looks stable.',
    options:[
      {value:'none',        icon:'✅', label:'No previous knee injury or surgery', score:100},
      {value:'minor',       icon:'🩹', label:'Minor injury — sprain, strain, bruising', score:82},
      {value:'significant', icon:'🔶', label:'Significant injury, no surgery', note:'ACL sprain, meniscal tear, cartilage damage', score:50},
      {value:'surgery',     icon:'🏥', label:'Previous knee surgery', note:'ACL reconstruction, meniscectomy, arthroscopy', score:32},
      {value:'replacement', icon:'⚙️', label:'Partial or total knee replacement', score:18}
    ]},

  // Genetic & longevity risk (domain: genetic)
  { id:'family', type:'options', domain:'genetic',
    eyebrow:'Genetic & longevity risk',
    text:'Does osteoarthritis or joint replacement run in your family?',
    sub:'OA heritability is 40–60%. A 2025 Nature study of nearly 2 million people identified 900+ genetic associations. A first-degree relative with OA raises your lifetime risk by ~40% — independently of lifestyle.',
    options:[
      {value:'no',     icon:'✅', label:'No known family history of OA or joint replacement', score:100},
      {value:'late',   icon:'🧬', label:'Yes — parent or sibling, after age 65', score:60},
      {value:'early',  icon:'⚠️', label:'Yes — parent or sibling before age 65', note:'Substantially elevated genetic risk', score:22},
      {value:'unsure', icon:'❓', label:"Not sure / don't know", score:60}
    ]},
];

const TOTAL = QUESTIONS.length;
let qIndex = 0;
let answers = {};

// ── Scoring ───────────────────────────────────────────────────────────────────
function calcKneeAge(a){
  const age = a.age || 45;
  const sex = a.sex || 'other';

  // Domain scores 0-100
  const bio      = avg([a.metabolic_s??65, a.nutrition_s??65, a.sleep_s??65]);
  const move     = avg([a.stiffness_s??65, a.sitting_s??65]);
  const strength = avg([a.strength_s??65, a.sit_stand_s??65]);
  const painRaw  = a.pain !== undefined ? a.pain : 3;
  const injScore = a.injury_s ?? 80;
  const injDomain= avg([Math.max(0,100-(painRaw*10)), injScore]);
  const genetic  = a.family_s ?? 65;

  // Weighted composite: strength highest evidence weight
  const composite = (
    bio      * 0.22 +
    move     * 0.16 +
    strength * 0.32 +
    injDomain* 0.16 +
    genetic  * 0.14
  );

  const delta = Math.round((75 - composite) * 0.38);
  let kneeAge = Math.round(age + delta);
  if(sex==='female' && age>=50) kneeAge = Math.min(kneeAge+2,90);
  kneeAge = Math.max(18, Math.min(kneeAge, 90));

  return {
    kneeAge, delta, age,
    domains:{
      bio:      Math.round(bio),
      move:     Math.round(move),
      strength: Math.round(strength),
      injury:   Math.round(injDomain),
      genetic:  Math.round(genetic)
    },
    familyRisk: a.family || 'unsure',
    painLevel:  painRaw
  };
}

function avg(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }

// ── Verdict & actions ────────────────────────────────────────────────────────
function getVerdict(delta){
  if(delta<=-3) return {
    label:'Younger than your years', color:'#27a96c', ring:'#27a96c',
    body:'Your joint biology is tracking younger than your chronological age. The work you are doing is measurable. Focus now on sustaining it — and widening the gap further.'
  };
  if(delta<=4) return {
    label:'Tracking close to your age', color:'#e09a3a', ring:'#e09a3a',
    body:'Your joint biology broadly reflects your age. Reassuring — and it also means there is meaningful room to shift the trajectory. A few targeted changes to your lowest-scoring domains can compound significantly over the next decade.'
  };
  return {
    label:'Older than your years', color:'#e05555', ring:'#e05555',
    body:'Your current biology is pushing your joint age ahead of your chronological age. Most of these factors are modifiable. This number is a direction, not a sentence — and it can change.'
  };
}

const DOMAIN_ACTIONS = {
  bio: {
    icon:'🥗',
    title:'Prepare the biological soil first',
    sub:'Anti-inflammatory nutrition (omega-3s, Mediterranean pattern), consistent 7–9 hours sleep, and addressing metabolic health are the foundation. Nothing in the R.E.P.A.I.R.™ pathway performs well inside a chronically inflamed body.',
  },
  move: {
    icon:'🔄',
    title:'Break prolonged sitting every 45 minutes',
    sub:'Stand, walk briefly, do ten slow bodyweight squats. Synovial fluid circulation depends on cyclical joint loading. Even small interruptions protect cartilage nutrition across thousands of daily repetitions.',
  },
  strength: {
    icon:'💪',
    title:'Start a progressive lower-limb strength programme',
    sub:'Two sessions per week — leg press, Romanian deadlift, hip thrusts, goblet squats. Muscle is the primary shock-absorber of the knee joint. The evidence for this is more robust than for any injection or supplement.',
  },
  injury: {
    icon:'🏥',
    title:'Previous injury or pain above 4 — clinical assessment before loading',
    sub:'If your pain is 4 or above, or you have had significant structural injury, a one-time clinical assessment before committing to a loading programme is worthwhile and clinically recommended.',
  },
  genetic: {
    icon:'🧬',
    title:'Genetic risk changes urgency, not the pathway',
    sub:'If OA runs in your family — especially before age 65 — the R.E.P.A.I.R.™ stages apply with greater urgency and at closer monitoring intervals. Start earlier, not differently.',
  },
};

function getTopActions(domains, painLevel, familyRisk){
  const ranked = Object.entries(domains)
    .filter(([k,v]) => !(k==='injury' && painLevel<4 && domains.injury>60))
    .sort((a,b)=>a[1]-b[1]);
  const actions = [];
  for(const [key] of ranked){
    if(actions.length>=3) break;
    if(DOMAIN_ACTIONS[key]) actions.push({...DOMAIN_ACTIONS[key], domain:key});
  }
  return actions;
}

function getGeneticPanel(risk){
  if(risk==='early') return { icon:'⚠️', label:'Elevated genetic risk', color:'#e05555', bg:'rgba(226,75,74,0.08)', border:'rgba(226,75,74,0.3)', text:'A first-degree relative with OA or joint replacement before age 65 places you in a higher-risk genomic category. Your biology is modifiable — but the urgency to act is greater. Stages R (Reset Biology) and P (Power) of R.E.P.A.I.R.™ should begin proactively, even without current symptoms. Annual Knee Age monitoring recommended.', cta:'Consider a 360 Assessment at Lanserhof Mayfair', ctaBg:'rgba(226,75,74,0.15)', ctaColor:'#e05555' };
  if(risk==='late') return { icon:'🧬', label:'Moderate genetic context', color:'#e09a3a', bg:'rgba(186,117,23,0.08)', border:'rgba(186,117,23,0.3)', text:'A family history of OA after age 65 indicates some inherited risk. Lower than early-onset, but worth factoring into your long-term joint strategy. Monitoring intervals for strength and resilience should be reviewed every 6 months.', cta:null };
  if(risk==='no') return { icon:'✅', label:'No known genetic risk factors', color:'#27a96c', bg:'rgba(39,169,108,0.08)', border:'rgba(39,169,108,0.3)', text:'No first-degree family history of OA or joint replacement. Your modifiable biology — strength, load, nutrition, sleep — is the primary driver of your joint trajectory. Build the habits that keep Knee Age as low as possible.', cta:null };
  return { icon:'❓', label:'Genetic risk — unknown', color:'#6b7c71', bg:'rgba(255,255,255,0.04)', border:'rgba(255,255,255,0.12)', text:"Family history of joint disease is one of the most useful clinical data points for setting programme urgency. If you can find out whether a parent or sibling has had OA or joint replacement, this will make your Knee Age score more accurate.", cta:null };
}

// ── Render logic ──────────────────────────────────────────────────────────────
function updateProgress(){
  const pct = Math.round((qIndex/TOTAL)*100);
  document.getElementById('progressText').textContent = `Question ${Math.min(qIndex+1,TOTAL)} of ${TOTAL}`;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
}

function getDomainInfo(key){ return DOMAINS.find(d=>d.key===key); }

function render(){
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  if(qIndex < TOTAL){
    updateProgress();
    renderQuestion(container, QUESTIONS[qIndex]);
  } else {
    document.getElementById('progressWrap').style.display='none';
    renderResult(container);
  }
}

function renderQuestion(container, q){
  const card = document.createElement('div');
  card.className = 'card';
  const dom = q.domain ? getDomainInfo(q.domain) : null;

  let html = `<div class="q-eyebrow">${q.eyebrow}</div>`;
  if(dom){
    html += `<div class="q-domain-badge" style="background:${dom.pillBg}22;color:${dom.pillColor};border-color:${dom.pillBorder}">
      <span style="width:8px;height:8px;border-radius:50%;background:${dom.color};display:inline-block"></span>
      ${dom.name}
    </div>`;
  }
  html += `<div class="q-text">${q.text}</div><div class="q-sub">${q.sub}</div>`;

  if(q.type==='options'){
    html += `<div class="options">`;
    q.options.forEach(opt => {
      const sel = answers[q.id]===opt.value ? ' selected' : '';
      html += `<button class="opt${sel}" onclick="selectOpt(this,'${q.id}','${opt.value}',${opt.score})">
        <div class="opt-icon">${opt.icon}</div>
        <div><div class="opt-label">${opt.label}</div>${opt.note?`<div class="opt-note">${opt.note}</div>`:''}</div>
      </button>`;
    });
    html += `</div>`;
  } else if(q.type==='slider'){
    const val = answers[q.id] || q.default;
    html += `<div class="slider-wrap">
      <div class="slider-val" id="sliderVal">${val}</div>
      <div class="slider-unit">${q.unit}</div>
      <input type="range" min="${q.min}" max="${q.max}" value="${val}" step="1" id="sliderInput" oninput="updateSlider(this)"/>
      <div class="slider-labels"><span>${q.labels[0]}</span><span>${q.labels[1]}</span></div>
    </div>`;
  } else if(q.type==='pain'){
    const val = answers[q.id]!==undefined ? answers[q.id] : -1;
    html += `<div class="pain-scale">`;
    for(let i=0;i<=10;i++) html += `<button class="pain-btn${val===i?' selected':''}" data-v="${i}" onclick="selectPain(this,${i})">${i}</button>`;
    html += `</div><div class="pain-labels"><span>No pain</span><span>Severe</span></div>`;
  }

  const hasAns = answers[q.id]!==undefined;
  const isSlider = q.type==='slider';
  html += `<div class="next-wrap"><button class="next-btn${(hasAns||isSlider)?' active':''}" id="nextBtn" onclick="nextQ()">Continue →</button></div>`;

  card.innerHTML = html;
  container.appendChild(card);
  window._currentQ = q;
  if(isSlider){ answers[q.id]=answers[q.id]||q.default; document.getElementById('nextBtn').classList.add('active'); }
}

function selectOpt(btn,qid,val,score){
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[qid]=val;
  answers[qid+'_s']=score;
  document.getElementById('nextBtn').classList.add('active');
}
function selectPain(btn,val){
  document.querySelectorAll('.pain-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  answers['pain']=val;
  answers['pain_s']=Math.max(0,100-val*10);
  document.getElementById('nextBtn').classList.add('active');
}
function updateSlider(inp){
  document.getElementById('sliderVal').textContent=inp.value;
  answers[window._currentQ.id]=parseInt(inp.value);
}
function nextQ(){
  const q=window._currentQ;
  if(q.type==='options'&&answers[q.id]===undefined) return;
  if(q.type==='pain'&&answers[q.id]===undefined) return;
  qIndex++;
  render();
}

// ── Result render ─────────────────────────────────────────────────────────────
function renderResult(container){
  const {kneeAge,delta,age,domains,familyRisk,painLevel} = calcKneeAge(answers);
  const verdict = getVerdict(delta);
  const actions = getTopActions(domains,painLevel,familyRisk);
  const genetic = getGeneticPanel(familyRisk);

  const r=72,cx=90,cy=90;
  const circ=2*Math.PI*r;
  const dash=circ*Math.min(Math.max((kneeAge-18)/(85-18),0),1);

  function domainColor(v){ return v>=70?'#27a96c':v>=50?'#e09a3a':'#e05555'; }
  function domainTag(v){
    if(v>=70) return '<span class="domain-tag good">Strong</span>';
    if(v>=50) return '<span class="domain-tag warn">Needs work</span>';
    return '<span class="domain-tag risk">Priority</span>';
  }

  const card = document.createElement('div');
  card.className='result-card';

  card.innerHTML=`
    <div class="result-label">Your Knee Age Assessment</div>
    <div class="result-ring">
      <svg viewBox="0 0 180 180">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${verdict.ring}" stroke-width="10"
          stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ*0.25}"
          stroke-linecap="round" style="transition:stroke-dasharray 1s ease"/>
      </svg>
      <div class="result-centre">
        <div class="result-age" style="color:${verdict.color}">${kneeAge}</div>
        <div class="result-age-lbl">Knee Age</div>
      </div>
    </div>
    <div class="result-compare">
      <div class="rc-box"><div class="rc-val">${age}</div><div class="rc-lbl">Your age</div></div>
      <div class="rc-arrow">→</div>
      <div class="rc-box hl"><div class="rc-val">${kneeAge}</div><div class="rc-lbl">Knee Age</div></div>
    </div>
    <div class="result-verdict">${verdict.label}</div>
    <div class="result-body">${verdict.body}</div>

    <div class="domains-title">Your five biological domains</div>
    ${DOMAINS.map(d => {
      const v = domains[d.key];
      const col = domainColor(v);
      return `<div class="domain-row">
        <div class="domain-row-top">
          <div class="domain-name-wrap">
            <div class="domain-dot" style="background:${d.dotColor}"></div>
            <span class="domain-name-text">${d.name}</span>
            <span class="domain-stage-pill" style="background:${d.pillBg}33;color:${d.pillColor};border-color:${d.pillBorder}">${d.stage}</span>
          </div>
          <div class="domain-score-wrap">
            <span class="domain-score">${v}</span>
            ${domainTag(v)}
          </div>
        </div>
        <div class="domain-bar"><div class="domain-fill" style="width:${v}%;background:${col}"></div></div>
      </div>`;
    }).join('')}

    <div class="domains-title" style="margin-top:22px">Genetic & longevity risk context</div>
    <div class="genetic-panel" style="background:${genetic.bg};border:1px solid ${genetic.border}">
      <div class="gp-header">
        <span class="gp-icon">${genetic.icon}</span>
        <span class="gp-title" style="color:${genetic.color}">${genetic.label}</span>
      </div>
      <p class="gp-body">${genetic.text}</p>
      ${genetic.cta?`<span class="gp-cta" style="background:${genetic.ctaBg};border:1px solid ${genetic.color}33;color:${genetic.ctaColor}">${genetic.cta}</span>`:''}
    </div>

    <div class="actions-title">Your 3 highest-impact actions</div>
    ${actions.map(a => {
      const dom = getDomainInfo(a.domain);
      return `<div class="action-item" style="background:${dom.bg}">
        <div class="ai-icon-wrap" style="background:${dom.pillBg}44;border:1px solid ${dom.pillBorder}">${a.icon}</div>
        <div>
          <div class="ai-title">${a.title}</div>
          <div class="ai-sub">${a.sub}</div>
          <span class="ai-pill" style="background:${dom.pillBg}33;color:${dom.pillColor};border-color:${dom.pillBorder}">${dom.name} · R.E.P.A.I.R.™ ${dom.stage.split('—')[0].trim()}</span>
        </div>
      </div>`;
    }).join('')}

    <div class="wl-cta">
      <div class="wl-cta-eyebrow">🔬 OrthoLongevity™ App — Early Access</div>
      <h3>Track your Knee Age.<br/><em>Change its trajectory.</em></h3>
      <div class="wl-feats">
        <div class="wl-feat">📈 Five-domain tracking over time</div>
        <div class="wl-feat">🎯 Personalised R.E.P.A.I.R.™ plan</div>
        <div class="wl-feat">🧬 Genomic risk layer coming</div>
        <div class="wl-feat">👨‍⚕️ Built by a consultant surgeon</div>
      </div>
      <div class="wl-success">
        <div class="wl-success-tick">✓</div>
        <div class="wl-success-title">You're on the list.</div>
        <div class="wl-success-body">Dr Arj will be in touch before launch with your personalised R.E.P.A.I.R.™ plan.</div>
      </div>
      <div class="wl-proof">🔒 <span>Joining <span class="wl-proof-count">2,400+</span> people already on the waitlist</span></div>
      <div style="margin-top:8px">
        <div style="font-size:11px;color:var(--muted);text-align:center;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px">Follow the work</div>
        <a class="social-link" href="https://substack.com/@drarj" target="_blank">
          <div class="social-icon">📖</div>
          <div><div class="social-name">The Ortholongevity Journal</div><div class="social-desc">Weekly clinical insights · Substack</div></div>
          <div class="social-arrow">→</div>
        </a>
        <a class="social-link" href="https://www.youtube.com/@ortholongevity" target="_blank">
          <div class="social-icon">▶</div>
          <div><div class="social-name">OrthoLongevity on YouTube</div><div class="social-desc">Evidence-based joint health videos</div></div>
          <div class="social-arrow">→</div>
        </a>
      </div>
    </div>
    <p class="disclaimer">This assessment is for educational and wellness purposes only. Knee Age is an estimate of biological joint resilience based on self-reported lifestyle factors. It is not a medical diagnosis and does not constitute clinical advice. If you have joint pain, please consult a qualified healthcare professional.</p>
  `;

  container.appendChild(card);
  setTimeout(()=>{
    card.querySelectorAll('.domain-fill').forEach(el=>{
      const w=el.style.width; el.style.width='0%';
      requestAnimationFrame(()=>{ el.style.width=w; });
    });
  },100);
}

render();
</script>
</body>
</html>
